<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>The Aeneid &mdash; A Companion</title>
<style>
:root{
  --char:#100c0a; --char2:#1a1310; --char3:#221913;
  --smoke:#332821; --smoke2:#463629;
  --ash:#ece4d9; --dim:#9b8f82; --faint:#6b6058;
  --ember:#e2712a; --hot:#f6b04a; --bone:#c2ab86;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --col:44rem;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ash);
  font-size:17px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
  padding-bottom:5rem;
}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; line-height:1.2; margin:0}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- chrome ---------- */
header.top{
  position:sticky; top:0; z-index:40;
  background-color:#100c0a;
  border-bottom:1px solid var(--smoke);
  padding:.65rem 1rem calc(.65rem + env(safe-area-inset-bottom,0px));
  display:flex; align-items:center; gap:.75rem;
}
.brand{font-family:var(--serif); font-size:1.02rem; letter-spacing:.02em; white-space:nowrap}
.brand em{font-style:italic; color:var(--hot)}
.backbtn{
  font-family:var(--mono); font-size:.7rem; letter-spacing:.09em; text-transform:uppercase;
  color:var(--dim); border:1px solid var(--smoke2); border-radius:2px; padding:.3rem .55rem;
}
.backbtn:hover{color:var(--hot); border-color:var(--ember)}
nav.tabs{
  display:flex; gap:0; overflow-x:auto; background-color:#0c0908;
  border-bottom:1px solid var(--smoke); position:sticky; top:47px; z-index:39;
  scrollbar-width:none;
}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  font-family:var(--mono); font-size:.68rem; letter-spacing:.11em; text-transform:uppercase;
  color:var(--faint); padding:.7rem .85rem; white-space:nowrap; border-bottom:2px solid transparent;
}
nav.tabs button[aria-current="true"]{color:var(--hot); border-bottom-color:var(--ember)}
main{max-width:var(--col); margin:0 auto; padding:1.6rem 1.15rem 3rem}

/* ---------- ash divider (signature) ---------- */
.ashline{
  height:26px; margin:2.2rem 0; border:0; opacity:.85;
  background-repeat:repeat-x; background-position:center;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='26'><g fill='%239b8f82'><circle cx='8' cy='16' r='1.1'/><circle cx='27' cy='9' r='.8'/><circle cx='41' cy='19' r='1.4'/><circle cx='58' cy='6' r='.7'/><circle cx='73' cy='14' r='1'/><circle cx='96' cy='21' r='.9'/><circle cx='112' cy='11' r='1.3'/><circle cx='131' cy='17' r='.8'/><circle cx='149' cy='5' r='1'/><circle cx='166' cy='20' r='1.2'/><circle cx='188' cy='12' r='.75'/><circle cx='205' cy='18' r='1'/><circle cx='224' cy='8' r='.9'/></g><g fill='%23f6b04a'><circle cx='63' cy='16' r='1.6'/><circle cx='177' cy='9' r='1.3'/></g></svg>");
}

/* ---------- type ---------- */
.eyebrow{font-family:var(--mono); font-size:.66rem; letter-spacing:.16em; text-transform:uppercase; color:var(--ember)}
.eyebrow.cool{color:var(--bone)}
.disp{font-family:var(--serif); font-size:2rem; line-height:1.1; margin:.35rem 0 .1rem}
.pron{font-family:var(--mono); font-size:.78rem; color:var(--hot); letter-spacing:.03em}
.essence{font-family:var(--serif); font-size:1.16rem; line-height:1.5; color:var(--ash); margin:.9rem 0 0}
p{margin:0 0 1rem}
main p:last-child{margin-bottom:0}
.lede{color:var(--dim)}

/* ---------- cards ---------- */
.card{
  background-color:#1a1310; border:1px solid var(--smoke);
  border-radius:3px; padding:1rem 1.05rem; margin:0 0 .75rem;
  display:block; width:100%; text-align:left;
}
.card:hover{border-color:var(--smoke2)}
.card h3{font-size:1.12rem}
.card .ess{color:var(--dim); font-size:.94rem; margin-top:.35rem; line-height:1.5}
.tag{
  font-family:var(--mono); font-size:.6rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--faint); border:1px solid var(--smoke2); border-radius:2px; padding:.12rem .35rem;
  margin-left:.45rem; vertical-align:middle; white-space:nowrap;
}
.tag.major{color:var(--hot); border-color:#5c4525}
.tag.stub{color:var(--bone); border-color:#4a3f30}

/* ---------- panels ---------- */
details.panel{
  border-top:1px solid var(--smoke); margin-top:.1rem; padding:.15rem 0;
}
details.panel summary{
  list-style:none; cursor:pointer; padding:.7rem 0;
  font-family:var(--mono); font-size:.7rem; letter-spacing:.13em; text-transform:uppercase;
  color:var(--dim); display:flex; align-items:center; gap:.5rem;
}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::before{content:"+"; color:var(--ember); font-size:.9rem; line-height:1}
details.panel[open] summary::before{content:"\2013"}
details.panel summary:hover{color:var(--ash)}
details.panel .pbody{padding:.15rem 0 1.1rem; color:var(--ash)}
details.panel.voices summary::before{color:var(--ember)}
details.panel.ear summary::before{color:var(--bone)}
details.sec summary{color:var(--ash); font-family:var(--serif); font-size:1.05rem; letter-spacing:0; text-transform:none}

/* ---------- links / popover ---------- */
.term{
  color:var(--ash); border-bottom:1px dotted var(--ember);
  cursor:pointer; padding:0 .02em;
}
.term:hover{color:var(--hot); border-bottom-color:var(--hot)}
.term.broken{background:#ff0055; color:#fff; padding:0 .2em}
#pop{
  position:absolute; z-index:60; width:min(19rem,calc(100vw - 2rem));
  background-color:#221913; border:1px solid var(--smoke2);
  border-radius:3px; padding:.85rem .9rem; display:none;
  box-shadow:0 12px 30px rgba(0,0,0,.6);
}
#pop.on{display:block}
#pop .pname{font-family:var(--serif); font-size:1.05rem}
#pop .ppron{font-family:var(--mono); font-size:.72rem; color:var(--hot); margin-top:.1rem}
#pop .pess{font-size:.9rem; color:var(--dim); margin-top:.45rem; line-height:1.45}
#pop .pgo{
  margin-top:.7rem; font-family:var(--mono); font-size:.66rem; letter-spacing:.11em;
  text-transform:uppercase; color:var(--hot); border:1px solid #5c4525; border-radius:2px;
  padding:.35rem .55rem; display:inline-block;
}
@media (max-width:560px){
  #pop{
    position:fixed; left:0; right:0; bottom:0; top:auto; width:100%;
    border-radius:12px 12px 0 0; border-left:0; border-right:0; border-bottom:0;
    padding:1.1rem 1.15rem calc(1.4rem + env(safe-area-inset-bottom,0px));
  }
}

/* ---------- ledger (signature lens) ---------- */
.ledger{margin-top:1.2rem; position:relative; padding-left:1.35rem}
.ledger::before{
  content:""; position:absolute; left:4px; top:.6rem; bottom:.6rem; width:1px;
  background:linear-gradient(#f6b04a,#e2712a 30%,#6b6058);
}
.led{position:relative; margin-bottom:.6rem}
.led::before{
  content:""; position:absolute; left:-1.35rem; top:1.05rem;
  width:9px; height:9px; border-radius:50%;
  background:var(--emb,#e2712a); box-shadow:0 0 0 3px #100c0a;
}
.led .book{font-family:var(--mono); font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--faint)}
.led h3{font-size:1.1rem; margin-top:.15rem}
.ledname{color:var(--ash); text-decoration:none; border-bottom:1px solid var(--smoke2)}
.ledname:hover{color:var(--hot); border-bottom-color:var(--ember)}
.led .lost{color:var(--ash); font-size:.95rem; margin-top:.3rem}
.led .bought{
  font-family:var(--mono); font-size:.76rem; color:var(--bone); margin-top:.45rem;
  border-left:2px solid #4a3f30; padding-left:.6rem; line-height:1.5;
}
.led .bought b{color:var(--bone); font-weight:400; text-transform:uppercase; letter-spacing:.1em; font-size:.62rem; display:block; margin-bottom:.15rem}

/* ---------- books ---------- */
.bookhead{display:flex; align-items:baseline; gap:.6rem; margin-top:2rem}
.bookhead .num{font-family:var(--mono); font-size:.72rem; color:var(--ember); letter-spacing:.1em}
.bookhead h2{font-size:1.35rem}
.half{
  font-family:var(--mono); font-size:.62rem; letter-spacing:.14em; text-transform:uppercase;
  color:var(--faint); border-top:1px solid var(--smoke); padding-top:.5rem; margin:2.4rem 0 .3rem;
}
.beat h3{font-size:1.06rem; margin-bottom:.1rem}
.beat .gloss{font-family:var(--mono); font-size:.65rem; letter-spacing:.1em; text-transform:uppercase; color:var(--bone); margin-bottom:.55rem}

/* ---------- rels / index ---------- */
.rels{margin-top:1.4rem; border-top:1px solid var(--smoke); padding-top:.9rem}
.rel{display:block; padding:.5rem 0; border-bottom:1px solid #1d1614}
.rel .rn{font-family:var(--serif); font-size:1rem; color:var(--ash)}
.rel .rl{color:var(--dim); font-size:.86rem}
.idx{columns:2; column-gap:1.2rem}
@media(max-width:480px){.idx{columns:1}}
.idx a{display:block; padding:.3rem 0; text-decoration:none; font-family:var(--serif); font-size:1rem}
.idx a:hover{color:var(--hot)}
.idx .ip{font-family:var(--mono); font-size:.66rem; color:var(--faint); margin-left:.3rem}
.group{margin-top:1.8rem}
.group h2{font-size:1.2rem; color:var(--ash)}
.group .gl{color:var(--dim); font-size:.88rem; margin:.2rem 0 .8rem}

.note{
  border-left:2px solid var(--ember); padding:.1rem 0 .1rem .9rem; color:var(--dim);
  font-size:.92rem; margin:1.3rem 0;
}
:focus-visible{outline:2px solid var(--hot); outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ================= BULLETPROOF BACKGROUND \u2014 must stay last ================= */
html{background:#100c0a!important; background-color:#100c0a!important; color-scheme:dark}
body{background:#100c0a!important; background-color:#100c0a!important; color:#ece4d9!important}
body::before{
  content:""; position:fixed; top:0; left:0; right:0; bottom:0;
  background-color:#100c0a; z-index:-1; pointer-events:none;
}
header.top{background-color:#100c0a!important}
nav.tabs{background-color:#0c0908!important}
#pop{background-color:#221913!important}
.card{background-color:#1a1310!important}
</style>

</header>

<script>
/* DATA:START */
var THEMES = [
 {
  "id": "th_cost",
  "name": "The Price",
  "gloss": "What each step toward Rome costs, and who pays it."
 },
 {
  "id": "th_fate",
  "name": "Fate & Will",
  "gloss": "A future that is fixed, and people who must still choose."
 },
 {
  "id": "th_furor",
  "name": "Fury",
  "gloss": "Rage, madness, and the fire that will not stay banked."
 },
 {
  "id": "th_pietas",
  "name": "Duty",
  "gloss": "Obligation to gods, father, son, and city \u2014 and its cruelty."
 },
 {
  "id": "th_exile",
  "name": "Exile & Home",
  "gloss": "Carrying a burnt country toward a coast you have never seen."
 },
 {
  "id": "th_rome",
  "name": "Rome to Come",
  "gloss": "The poem's other audience: Augustus, listening."
 },
 {
  "id": "th_gods",
  "name": "The Divine Machine",
  "gloss": "Immortals argue; mortals are the currency."
 },
 {
  "id": "th_dead",
  "name": "The Dead",
  "gloss": "The unburied, the unfinished, and those who will not forgive."
 }
];

var ENTITIES = [
 {
  "id": "dido",
  "name": "Dido",
  "pron": "DY-doh",
  "aka": "Elissa",
  "type": "mortal",
  "tier": "major",
  "themes": [
   "th_cost",
   "th_furor",
   "th_exile",
   "th_rome",
   "th_dead"
  ],
  "essence": "A widow who built a city out of nothing, gave it away to a man who was only passing through, and left behind a curse that became three wars.",
  "sections": [
   {
    "h": "Before the Poem",
    "body": "Her name in Tyre was Elissa. She was a king's daughter on the Phoenician coast, married to [[sychaeus|Sychaeus]], the richest man in the city and the priest of its temple \u2014 and she loved him, which the poem mentions once, flatly, the way you mention a fact.\n\nHer brother Pygmalion was king, and greedy, and blind with it. He caught Sychaeus alone at the altar and killed him there. Then he went on having dinner with his sister for months, inventing reasons, promising news, telling her to keep hoping.\n\nThen the dead man came to her in her sleep. He was pale in a way the dream would not let her look away from. He turned and showed her the altar. He showed her the wound. He told her to run, and told her where the money was buried \u2014 an old weight of silver and gold under the ground that nobody living knew about.\n\nShe did not mourn in place. She found everyone in Tyre who feared her brother or hated him, and there were a great many, and she found ships lying ready in the harbour, and they loaded the gold at night and went. When they made landfall on the African coast she asked the locals to sell her as much ground as one oxhide would cover. They laughed, and agreed, and took the money. She cut the hide into a single strip as thin as a hair and ran it around an entire hill.\n\nThey called the citadel the Byrsa \u2014 the Hide \u2014 for the next seven hundred years. The city under it was [[carthage|Carthage]], and it was hers.\n\nShe has already done the thing [[aeneas|Aeneas]] is trying to do. She is the exile who succeeded. That is the joke the poem never makes and the wound it never closes."
   },
   {
    "h": "The Guest",
    "body": "He comes ashore filthy, with eleven men and no fleet he can account for, and his mother wraps him in a cloud so he can walk into her city without being seen.\n\nWhat he sees is a building site with a queen in it. Men are hauling stone up the slope. A theatre is being cut out of the rock \u2014 they are shaping columns for a stage that does not exist yet. She is laying down laws, drawing lots for the work, settling disputes as she walks. It is like a hive in early summer, [[virgil|Virgil]] says, when the whole colony is out and the smell of honey is over everything. And Aeneas stands in his cloud and says the line that gives him away: fortunate people, whose walls are already going up.\n\nThen he sees the murals. On the wall of a temple, in a city on the wrong continent, someone has painted his war. There is [[priam|Priam]]. There is [[hector|Hector]] being dragged around the walls. There is Aeneas himself, a face among the Greek princes, a figure in a battle scene in a foreign country. He stands in front of it and cries \u2014 not from grief exactly, but from the strangeness of being known here, of his catastrophe having travelled ahead of him and arrived as decoration.\n\nDido comes into the temple. The cloud opens. He steps out of it with the light on him.\n\nThat night, at the feast, she asks him to tell it from the beginning. He talks until the stars have gone all the way round. She keeps finding new questions to keep him talking \u2014 what did Hector look like, what did the [[horse|horse]] look like, tell that part again. And when he finally stops she lies awake in the dark replaying his sentences, his face and his words fixed in her, and the wound is already feeding."
   },
   {
    "h": "The Cave",
    "body": "At first light she goes to her sister. I know this feeling, she says. It is the old fire. I swore at [[sychaeus|Sychaeus]]'s grave that I was finished with it, and I would rather the earth swallowed me than break that \u2014 and then she says his name, and [[anna|Anna]] hears everything in the way she says it.\n\nAnna is kind, and reasonable, and catastrophic. What good is grief to the dead? You are a young queen alone, with a desert full of enemies at your back \u2014 [[iarbas|Iarbas]], the Gaetulians, the Numidians \u2014 and a Trojan fleet sitting in your harbour. Think what this city could be with those ships behind it.\n\nIt is exactly the advice a loving sister gives. It is also permission, and Dido has been waiting for permission.\n\nAbove them, out of sight, the goddesses are talking. [[juno|Juno]] proposes it like a treaty: let them marry, end the wandering, one people, a shared throne, and Carthage keeps the man Rome needs. [[venus|Venus]] sees straight through it and agrees on the spot, sweetly, because she knows [[jupiter|Jupiter]] will never permit it and would rather Juno found that out for herself. Two goddesses shake hands over a woman neither of them intends to protect.\n\nSo the hunt goes out at dawn: horses stamping in the gateway, purple and gold, the queen in an embroidered cloak with her hair in a gold clasp, [[ascanius|Ascanius]] riding hard and wishing aloud that something bigger would come down off the mountain.\n\nThen the sky goes black. Hail. The hunting party breaks apart down the hillsides and the water comes off the rocks in sheets \u2014 and Dido and the leader of the Trojans arrive at the same cave.\n\nEarth moves first. Then Juno, who has charge of marriages. Lightning stands where the wedding torches should be. The sky is the witness. And on the ridge above them the mountain nymphs scream.\n\nThat day was the first cause of death, and the first cause of everything that followed.\n\nShe called it marriage. She used that word to cover her fault. That is what the poem says, and it never takes it back.\n\nAnd Rumour goes out over Africa: small at first, and frightened, then walking on the ground with her head in the clouds, a feather on her for every watching eye and under each feather an ear and a mouth. She sings what happened and what did not in the same voice, and she says it in every town \u2014 a Trojan has come, the queen has taken him into her bed, and all winter, forgetting their kingdoms, the two of them are wintering in luxury."
   },
   {
    "h": "The Pyre",
    "body": "[[iarbas|Iarbas]] hears it with his hands on the altar and prays in a fury of hurt vanity \u2014 that woman who wandered into my country and bought a strip of my coast now refuses me and lets a perfumed Trojan into her house. And up in heaven [[jupiter|Jupiter]] turns and looks down and sees the future founder of Rome laying out street plans in a purple cloak that Dido embroidered for him herself, with a jewelled sword on his hip.\n\n[[mercury|Mercury]] lands with a message that is mostly contempt. Aeneas is struck dumb, his hair standing up, his voice stuck in his throat. He burns to go.\n\nAnd then he does the thing readers have never forgiven. He tells the captains to get the fleet ready quietly \u2014 arm them, cover the reason, keep it from her \u2014 while he looks for the gentlest opening, the right moment, the best way to raise it. He is going to manage her.\n\nShe knows within a day. Who ever fooled a lover?\n\nWhat follows runs three hundred lines and she wins every point in it except the only one that counts. Did you really think you could hide this from me? Am I not worth staying for \u2014 not the hand I gave you, not Dido dying? She has burned her name for him. Iarbas is waiting. Her own people despise her now. And then she stops arguing and asks him for one thing: leave me a child. If there were even a small Aeneas playing in the hall, with your face, I would not feel completely taken and completely abandoned.\n\nHe stands there with his eyes down. He says the things he has. He never held a wedding torch. He never entered into that contract. If fate had let him choose, he would still be in [[troy|Troy]], rebuilding it for the dead. A god ordered him. Italy is not his desire; Italy is his duty. Stop setting us both on fire with your complaints. I go to Italy against my will.\n\nShe hears it out. Then: you are no son of a goddess. Rocks made you. Tigers nursed you. And she is carried out fainting, while he \u2014 longing to soothe her grief \u2014 goes back to the ships.\n\nAfter that it is quick, and domestic, and horrible. The holy water in the bowl turns black. At night she hears Sychaeus calling her name from the shrine, and an owl on the roof going on and on.\n\nShe has a pyre built in the inner courtyard and tells Anna it is a rite \u2014 a priestess from the far west taught it, it will either bring him back or free her \u2014 and asks her to help stack it with the clothes he left, and the bed, and the sword. Anna helps. Anna does not understand what she is helping to build, and neither does anyone reading it for the first time.\n\nAt dawn she is on the tower. The harbour is empty. The sea is full of sails.\n\nThe curse comes out like a formula, because it is one. Let an avenger rise from my bones and hunt them with fire and iron \u2014 now, or later, whenever the strength comes. Shore against shore, wave against wave, weapons against weapons. Them, and their children, and their children's children.\n\nThen she climbs the pyre and takes up the sword. A Trojan sword. A gift. Not bought for this.\n\nI have lived. I have finished the course that fortune gave me. I built a famous city. I saw my own walls. I avenged my husband and I punished my brother. Happy \u2014 too happy \u2014 if only the Trojan keels had never touched my shore.\n\nThe scream goes up through the house. Anna comes through the crowd tearing at her own face, and gets her arms under her, and tries to stop the blood with the hem of her dress. Three times Dido pushes herself up onto her elbow. Three times she falls back. She looks for the light, and finds it, and groans.\n\nShe is three days dying. She was not owed this death \u2014 not by fate, not by any crime \u2014 and so the underworld will not take her; Proserpina has not cut the lock that lets a soul go. In the end it is [[juno|Juno]], who arranged the whole thing, who takes pity and sends someone down to cut it."
   },
   {
    "h": "Afterward",
    "body": "He sees her once more, and it is worse than the pyre.\n\nDown among the dead there is a place called the Fields of Mourning, where those whom hard love wasted walk in a myrtle wood with their wounds still on them. He comes through the dark and she is there, still bleeding.\n\nHe is not sure at first \u2014 the way you are not sure of a face in fog, or of a new moon behind cloud. Then he cries, and speaks to her softly. Was it true? Was it the sword? Was I the cause? He swears by the stars and by the gods below that he went unwillingly. He says he did not think \u2014 did not believe \u2014 that his leaving could bring her grief as great as this.\n\nShe does not look at him. He is talking; she is looking at the ground. Her face does not move any more than flint moves.\n\nThen she turns and goes back into the shadow of the wood, where [[sychaeus|Sychaeus]] is waiting for her, who answers her love and gives it back to her equal.\n\nAeneas stands where she left him, shaken, crying, watching her go.\n\nIt is the only argument in the poem that anyone wins against Rome, and she wins it by not saying a word."
   }
  ],
  "beneath": "<p>She is the poem's biggest problem, and [[virgil|Virgil]] built the problem on purpose. He gives an enemy of Rome the best writing in the book, the strongest case, and the only exit that cannot be answered \u2014 and then asks you to keep walking with the man on the ship.</p><p>The official defence is that she is [[furor|furor]]: appetite, delay, the harbour that is too comfortable to leave, the thing [[pietas|duty]] has to burn through. Read that way, Book IV is a test and Aeneas passes it. The trouble is what Virgil actually put on the page. She is not a temptress. She is a working head of state, better at the job than he is, doing in one summer what he has failed to do in seven years \u2014 and the poem lets her say so.</p><p>Look at what destroys her. Not lust. A vow. She swore to a dead husband that she was finished with love, and she breaks it, and it kills her. That is the same virtue the poem hangs on Aeneas like a title \u2014 loyalty to the dead, kept past all reason. He is called <em>pius</em> for keeping his. She dies for breaking hers. Virgil hands them both the same value and lets it save one and gut the other, and he does not comment.</p><p>Two readings have been live since antiquity. In one, her death is tragic and necessary \u2014 an empire has a price, and Virgil is honest enough to name it. In the other, Book IV is where the official argument splits open: if this is what it costs, the poem has quietly convicted the thing it was paid to celebrate. I will say plainly that the second reading flatters modern taste, that it is a comfortable way to keep liking an imperial poem, and that Virgil's first audience was not full of ironists. But the crack is really in the text, and he really put it there.</p><p>And note the one thing she asks for and does not get. A child. A son by Aeneas would have folded Carthage into the Roman line and made [[punic_wars|three wars]] unnecessary. The poem refuses her the only thing that would have cost nobody anything.</p>",
  "beyond": "<p>A Roman hearing Book IV had a reflex, and it was not romance. [[carthage|Carthage]] was the enemy that had come closest to killing Rome: three wars across a hundred and eighteen years, Hannibal loose in Italy for sixteen of them, and at the end a city burned, its ground turned over, its people sold. When Dido calls an avenger up out of her own bones, every listener in the room could put a name to him.</p><p>So the book does two things at once. It breaks your heart, and it explains \u2014 in the language of myth, which is how Romans explained things \u2014 why Rome had to destroy [[punic_wars|Carthage]]. Whether both jobs can be done in the same book without one poisoning the other is the whole argument about this poem.</p><p>Her afterlife is enormous, and it belongs to her rather than to him. Ovid rewrote her as a woman writing a furious letter. Saint Augustine, who grew up in North Africa within reach of her ruins, confessed that as a schoolboy he had wept over Dido's death while feeling nothing at all about the state of his own soul \u2014 which is, backhandedly, the best review Virgil ever got. Marlowe put her on a stage. Purcell gave her the most famous lament in English music: three minutes, still sung. The woman on the losing side of history has comfortably outlived the empire that needed her to lose.</p>",

  "essence": "A man carrying his father on his back and his son by the hand, walking away from everything he loves because a god told him to \u2014 and the least happy hero in epic.",
  "sections": [
   {
    "h": "Before the Poem",
    "body": "His mother is a goddess and his father is a shepherd she wanted for an afternoon on Mount Ida. That is the whole story of his birth, and [[anchises|Anchises]] spent the rest of his life being careful about how he told it.\n\nIn Homer he is a second-rank Trojan \u2014 a cousin of [[hector|Hector]]'s, a decent fighter, twice pulled out of a fight he was losing by a god who says, in front of everyone, that this man has a future and is not to be killed here. That is the seed [[virgil|Virgil]] is growing from: a minor character with a note in the margin saying he survives.\n\nHe has a wife, [[creusa|Creusa]], one of [[priam|Priam]]'s daughters. He has a small son, [[ascanius|Ascanius]]. He has a house on the edge of the citadel, and a father who cannot walk, and no ambition anyone has recorded."
   },
   {
    "h": "The Last Night",
    "body": "He is asleep when it starts. [[hector|Hector]] comes to him in a dream, and he is filthy, and his feet are swollen where the thongs went through them, and his beard is stiff with blood. Aeneas \u2014 dreaming, and stupid with sleep \u2014 asks him where he has been.\n\nHector does not answer that. He says: run. [[troy|Troy]] is finished. Take the household gods and go and find them walls somewhere else.\n\nAnd Aeneas ignores him completely. He wakes up, hears the fighting, straps on armour that is no use to anybody, and goes out into the street to die \u2014 which is, he says, the beautiful thing to do when you are past hope. He spends the rest of the night trying to get killed. He puts on Greek armour and kills Greeks with it. He watches [[priam|Priam]] cut down at the altar and thinks about murdering Helen in a doorway.\n\nHis mother stops him. She takes the mist off his eyes and lets him see what is actually happening: [[neptune|Neptune]] levering the walls apart from underneath, [[juno|Juno]] at the gate with a sword, [[jupiter|Jupiter]] handing out the strength. It is not the Greeks. It is the gods, and they are pulling the city down with their hands.\n\nSo he goes home, and his father refuses to leave. And they stand there arguing in a burning house until a small flame appears in the boy's hair and does not burn him \u2014 and the old man, who has spent the whole scene wanting to die, holds up his hands and asks for a sign to confirm it, and gets thunder on the left.\n\nThen the carry. The father on the shoulders, holding the gods of the house because Aeneas's hands are bloody and may not touch them. The boy's hand in his. His wife told to follow at a distance."

    "h": "Seven Years of Getting It Wrong",
    "body": "They are told to look for their ancient mother. [[anchises|Anchises]] says confidently that this means Crete. It does not mean Crete. They build a whole town there, name it, start ploughing, and a plague comes and kills the crops and the people, and the household gods have to appear at night and explain that the answer was Italy and always was.\n\nThis is the pattern, and it is the most under-read thing about him. He is not led. He is issued instructions in riddles and gets them wrong, and people die of it, and he goes on.\n\nAt Buthrotum he finds the strangest thing in the poem: a miniature Troy. Two survivors have built a scale model of the lost city \u2014 a little Troy, a dry stream they have named the Xanthus, a false gate. [[hector|Hector]]'s widow is there, married to her dead husband's brother, making offerings at an empty tomb. Aeneas walks around it. He is polite. He leaves.\n\nHe never says what he thinks of it, and he never builds one.\n\nAnd then, in Sicily, with the worst of the sea behind them, his father dies. He tells this entire three-book story out loud at a dinner table in [[carthage|Carthage]], and when he reaches that, he says he lost his father, his comfort in every trouble. And then the poem says: he stopped, and having finished, he was silent."
   },
   {
    "h": "The Duty",
    "body": "The word the poem hangs on him is <em>[[pietas|pius]]</em>, and it does not mean pious and it does not mean good. It means he pays what he owes \u2014 to the gods, to his father, to his son, to the people following him \u2014 and it does not ask whether he wants to.\n\nThe first words out of his mouth in the whole poem, in a storm off Africa, are a wish that he had died at Troy. He weeps more than anyone else in the epic. He is given a [[shield|shield]] with seven centuries of Roman history worked into the metal, and the poem says, in the flattest possible way, that he marvels at it without understanding it, and lifts onto his shoulder the fame and the fates of his descendants.\n\nThat is him. He carries things he cannot read.\n\nAnd he does the job. He leaves [[dido|Dido]]. He goes down to the dead and comes back. He makes the alliance, fights the war, takes the country. Whether the poem admires him for it is the question the poem will not close."

   {
    "h": "The Last Twelve Lines",
    "body": "[[turnus|Turnus]] is down, with a spear through the thigh, and he is not asking for his life. He is asking to be sent back to his father, alive or dead, whichever Aeneas prefers. He says: you have won. The girl is yours. Do not push your hatred any further.\n\nAnd Aeneas stops.\n\nThe poem holds him there. He is standing over a beaten man with the sword up and his eyes moving, and the words are working on him, and he is beginning to be turned \u2014 and every reader for two thousand years has watched that hesitation and felt the poem open.\n\nThen the man on the ground shifts his shoulder, and the light catches a strip of gold studs, and Aeneas sees [[baldric|the belt]]. A boy's sword-belt, taken as a trophy, worn like a coat.\n\nHe goes in blazing with rage. He says: you, dressed in the spoils of my own, are to be taken out of my hands? and he puts the sword in up to the hilt.\n\nAnd the poem ends. Not on a triumph, not on a founding, not on a wedding. On a killing that the hero had already decided not to do."

  "beneath": "<p>He is the least likeable hero in epic and that is not a failure of the writing. Achilles is magnificent. Odysseus is delightful. Aeneas is tired.</p><p>Read what he actually does. He tries to die in Book II and has to be stopped. He gets the oracles wrong for seven years. He is caught building someone else's city and has to be shouted at by a god. He leaves the woman who loved him and does it badly, and then in the underworld tells her he did not think it would upset her that much. He is not a bad man. He is a man with a job so large that he has stopped being able to want anything, and [[virgil|Virgil]] wrote him that way on purpose, because that is what the job costs.</p><p>And then the ending. The poem has spent twelve books saying that [[furor|furor]] \u2014 rage, the fire in the blood \u2014 is the thing Rome exists to shut in a room. It is what [[juno|Juno]] is. It is what [[dido|Dido]] burns with. It is what [[allecto|a Fury]] puts into [[turnus|Turnus]] with a snake. And in the last four lines the founder of Rome catches it.</p><p>Two ways to take that, and they are both serious. The Roman one: this is justice. [[pallas|Pallas]] was under his protection, and Roman law and Roman feeling both permitted \u2014 required \u2014 vengeance for a killed dependant. Turnus stripped the boy and wore him. He is not a suppliant; he is a proud man caught, and [[anchises|Anchises]]'s instruction in Book VI was to spare the conquered <em>and war down the proud</em>. Aeneas is following orders.</p><p>The other one: he had already stopped. The poem shows you the hesitation, and shows you the mercy beginning, and then takes it away \u2014 and if [[virgil|Virgil]] wanted a clean execution he did not have to write the hesitation at all.</p><p>I lean toward the second, and I am telling you that so you can discount it. But note what nobody disputes: the poem ends on the word <em>shades</em>, in a groan, and there is no line after it.</p>",
  "beyond": "<p>He is not a character to Virgil's first audience. He is an ancestor.</p><p>[[ascanius|Ascanius]]'s other name is Iulus, and the Julian family \u2014 Julius Caesar's family, and by adoption [[augustus|Augustus]]'s \u2014 claimed descent from him, and therefore from [[venus|Venus]]. This was not a poetic flourish; it was public policy. Caesar built a temple to Venus Genetrix, Venus the Ancestress, in his own forum. When Aeneas lifts a shield with Actium engraved on it, the man who won Actium is sitting in the room.</p><p>There is also a problem Virgil has to manage, and you can watch him do it. Being Trojan was awkward. Trojans lost. Worse, there was an old and persistent tradition \u2014 in Greek sources, and known at Rome \u2014 that Aeneas survived the sack because he betrayed the city to the Greeks. Virgil answers this the only way you can: he gives Aeneas a whole book to tell the story himself, in the first person, in which he fights until the gods physically stop him. Book II is a defence brief.</p><p>And <em>[[pietas|pietas]]</em> was Augustus's own advertised virtue \u2014 stamped on coins, carved on altars, the thing the regime said it was made of. Handing that word to Aeneas is the most political act in the poem, which is exactly why the last twelve lines are the most dangerous.</p>",

   {
    "h": "Before the War",
    "body": "He is a prince of the Rutulians, at Ardea, a few days south of the Tiber. He is young and beautiful and by a long way the best soldier in Italy. His family goes back to a river-god and a nymph. [[amata|The queen]] wants him for her daughter and has said so publicly. [[latinus|The king]] has not said no.\n\nHe has not done anything wrong. He is not a tyrant, or a monster, or an invader. He is a local man who has been promised a marriage, in a country where nothing has happened for a hundred years, and one afternoon a fleet of foreigners rows up the river and their leader is told by an oracle that the girl is his.\n\nThat is the entire case against him. He objected."

    "h": "The Snake",
    "body": "[[juno|Juno]] cannot beat the fates, so she settles for making the wedding expensive, and calls up [[allecto|a Fury]] out of hell.\n\nShe comes to him at night as an old priestess and tells him, reasonably, in a quavering voice, that he is being robbed and should march. He laughs at her. It is the best moment he gets: a young man in bed being lectured by an old woman about foreign policy, telling her kindly that war and peace are men's business, and that she should get back to her temple.\n\nSo she stops pretending. Snakes come up in her hair, her eyes go still, and she throws a torch into him and it sticks, smoking, under his ribs. He wakes up screaming for his weapons. He looks for his sword in the bed. The poem says: the love of the sword raged in him, and the criminal madness of war, and above all, anger.\n\n[[virgil|Virgil]] is careful, and it matters. The Fury does not invent anything. She lights something that was already dry."
   },
   {
    "h": "The Boy",
    "body": "He does one unforgivable thing, and the poem lets him do it with his eyes open.\n\nHe clears the field to get at [[pallas|Pallas]] \u2014 [[evander|an old man's]] only son, on his first day of war, on loan to [[aeneas|Aeneas]] with a father's request attached. He tells everyone to stand back. He says he wishes the father were here to watch.\n\nThe boy throws and misses. Turnus throws once. Then he puts his foot on the body to get the spear out, and takes [[baldric|the sword-belt]] \u2014 wide, heavy, gold-worked \u2014 and puts it on.\n\nAnd here [[virgil|Virgil]] stops the whole battle to speak in his own voice, which he almost never does. The mind of man, he says, knows nothing of fate or of what is coming, or how to keep its balance when things are going well. There will be a time when Turnus would pay anything not to have touched that boy, and will hate this belt, and this day."
   },
   {
    "h": "The Last Twelve Lines",
    "body": "By the end he knows. His sister has been on the field disguised as his charioteer, keeping him away from [[aeneas|Aeneas]], and he sees through her and tells her to stop \u2014 is dying really so terrible? \u2014 and says the thing that turns him from an antagonist into something else: this madness, now, is enough.\n\nSo he walks out to a duel he expects to lose, and asks only that they stop the fighting behind him.\n\nHis sword breaks in his hand \u2014 he had grabbed the wrong one leaving the house. He runs. The spear goes through his thigh and he goes down on one knee in front of an entire army.\n\nAnd then he does not beg for his life. He says: I have earned this. I am not asking for mercy. Take what you have won. But if a wretched father's grief can reach you at all \u2014 and you had a father like mine \u2014 have pity on old Daunus. Send me back to my people. Or my body, if you like. You have won. [[lavinia|The girl]] is yours. Do not push your hatred any further.\n\nAeneas stops. He is turning. He is going to let him live.\n\nThen the light catches the belt on his shoulder.\n\nHis limbs go slack with the cold, and his life flees, resentful, with a groan, into the shades. That is the last line of the poem, and it was [[camilla|written once before]], for a girl who died chasing a gold breastplate."
   }

  "beneath": "<p>The poem announced itself as the <em>Iliad</em> answered, and told you [[turnus|Turnus]] would be its Achilles. And then it made him Hector.</p><p>Look at the shape of the ending. A local man defends his own country against an invading fleet, is deserted by the gods, is hunted round the field by an enemy with a divine mother and divine armour, and is killed while his family watches from the walls. That is not the Achilles story. That is the Hector story, and Virgil has handed it to the man Rome has to kill.</p><p>Which makes [[aeneas|Aeneas]] Achilles \u2014 the sacker of cities, the man who kills in a rage over a dead boy and will not give the body back until he is asked. Virgil built his national epic so that the founder of Rome ends up standing exactly where Achilles stood. He did not have to do that.</p><p>And the poem gives Turnus the one thing it never gives Aeneas: the ability to want something. He wants the girl, he wants the fight, he wants his name. He is wrong, he is proud, and he is fully alive, and by Book XII he has grown up enough to walk out to his own death and say so.</p><p>He is also, unavoidably, Italian. So was [[virgil|Virgil]].</p>",
  "beyond": "<p>Here is the thing a Roman heard in Book XII that we have to be told.</p><p>Italy was not always Rome. Within living memory of Virgil's first readers \u2014 within his own childhood \u2014 Rome had fought the Social War against her own Italian allies: three years, tens of thousands dead, Italians demanding Roman citizenship and getting it only after they nearly won. Virgil was born in Mantua, in Cisalpine Gaul, which did not get full Roman citizenship until he was in his forties. When the Trojans and the Latins fight over who gets to be Italy, that is not archaeology. That is a wound with people still limping from it.</p><p>And then the civil wars: Romans killing Romans for a hundred years, ending at Actium. When the poem's final image is a Roman putting a sword into a beaten, begging Italian who has already surrendered, an audience of [[augustus|Augustus]]'s Rome did not need that explained to them. They had watched it. Some of them had done it.</p><p>Which is why [[juno|Juno]]'s last demand in Book XII lands the way it does. She gives up \u2014 and asks that the Latins keep their own name, their own language, their own clothes; that Troy be gone for good. Jupiter grants it. So the country Turnus died defending is the country that wins the argument. The Trojans are absorbed and disappear. Rome speaks Latin.</p>",

  "essence": "Queen of heaven, holding a grudge she cannot win, and the actual engine of every disaster in the poem \u2014 the story starts with her rage and ends when she is bought off.",
  "sections": [
   {
    "h": "The Grudge",
    "body": "The poem opens with a question and never answers it: can there be anger like this in the minds of gods?\n\nHer reasons are listed, and they are petty in a way [[virgil|Virgil]] wants you to notice. A Trojan shepherd once judged a beauty contest and did not pick her. A Trojan boy was carried off to heaven to pour [[jupiter|her husband's]] wine. Old business. Ancient injuries, stored.\n\nAnd then the real one. She loves [[carthage|Carthage]]. She has decided it will rule the world, and she keeps her chariot and her armour there. And she has heard \u2014 the fates have said it \u2014 that a people descended from Trojan blood will one day come and pull it down.\n\nSo she is not fighting a man. She is fighting the future, which she has read, and which she knows she cannot change. Everything she does in twelve books is done by a person who already knows how it ends."
   },
   {
    "h": "The Storm",
    "body": "She goes to [[aeolus|Aeolus]], who keeps the winds shut in a mountain, and offers him a nymph.\n\nHe opens the door. The winds come out sideways, all of them at once, and hit the fleet on open water \u2014 and this is the first thing that happens in the poem, before we have met anybody, before we know why. Ships turned side-on. A man's arms out of the water. Grain and gear floating.\n\n[[neptune|Neptune]] puts his head up and is furious, not at the storm but at the trespass, and the sea goes flat in four lines.\n\nBut she has done what she wanted. Seven ships out of twenty limp into an African harbour, and the harbour is hers, and there is a queen in it."
   },
   {
    "h": "The Fury in the Field",
    "body": "Six books later, with the Trojans finally in Italy and the marriage nearly agreed, she says the sentence the whole second half hangs on: if I cannot bend heaven, I will move hell.\n\nAnd she goes down and gets [[allecto|Allecto]], who is a Fury \u2014 a creature so hateful that her own father cannot stand her \u2014 and turns her loose on a peaceful country with three instructions.\n\nAllecto puts a snake into [[amata|the queen]] and makes her run mad through the woods. She puts a torch into [[turnus|Turnus]] and makes him scream for his weapons. And then she does the small thing, the one that actually starts the war: she makes a boy's hunting dogs pick up the scent of a tame stag \u2014 a pet, a farm girl's stag that came home in the evenings to be combed \u2014 and he shoots it, and it drags itself home to die, and the farmers come out with billhooks and fire-hardened stakes, and Italy is at war.\n\nA pet. That is how the war starts. [[virgil|Virgil]] chose that."
   },
   {
    "h": "The Deal",
    "body": "In Book XII, at the end of everything, [[jupiter|Jupiter]] tells her to stop. It is over. She has lost, and he says so kindly, and asks her to give it up.\n\nAnd she does. And then she asks for one thing \u2014 for a favour that is, she says, forbidden by no law of fate.\n\nWhen they marry, and they will, let the Latins keep their own name. Do not make them Trojans. Do not make them change their language or their dress. Let Latium go on. Let the Alban kings be Alban. Let Rome, when it comes, be great with Italian strength. Troy has fallen \u2014 let Troy stay fallen, name and all.\n\nAnd Jupiter smiles, and gives her everything she asks for.\n\nRead it again. The people who arrive on the ships are erased. Their name goes, their language goes, their clothes go. The country absorbs them and keeps itself.\n\nJuno loses the argument and wins the settlement."

  "beneath": "<p>She is the engine. Nothing happens in this poem that she did not start. The storm, [[dido|Dido]], the burning of the ships, the war, the death of [[pallas|Pallas]], the death of [[turnus|Turnus]] \u2014 trace any of it back and you arrive at her, and the poem's first question is about her: can there be such anger in the minds of gods?</p><p>What she personifies is [[furor|furor]] at the level of heaven \u2014 rage that knows it is futile and continues anyway. [[allecto|The Fury]] she summons is not a separate character so much as her own psychology outsourced and given a body. And in the poem's moral scheme, <em>furor</em> is the thing Rome exists to lock up. So the poem's official argument is: Rome is what happens when this is finally chained.</p><p>Except that in Book XII she is not chained. She is negotiated with, and she gets her terms, and she goes home. And in the last four lines the founder of Rome catches her disease.</p><p>Here is the reading that ruins your afternoon. If the settlement gives her everything \u2014 Latin name, Latin tongue, Trojans erased \u2014 then run the ledger. [[creusa|A wife]], [[anchises|a father]], [[dido|a queen]], [[palinurus|a helmsman]], [[pallas|a boy]], [[camilla|a woman]], [[amata|a mother]], [[turnus|a prince]]. And what was purchased, in the end, was a change of name that the losing side asked for and got.</p>",
  "beyond": "<p>Juno was not an exotic villain to a Roman. She was one of the three gods on the Capitol \u2014 Juno Regina, Juno the Queen, sharing the greatest temple in the city with [[jupiter|Jupiter]] and Minerva. Romans prayed to her. Roman women prayed to her about marriage and childbirth. The poem's antagonist is a goddess the audience worshipped.</p><p>And this is not an accident of casting. Rome had a formal ritual called <em>evocatio</em>, in which, before destroying an enemy city, the Romans would publicly invite that city's gods to leave it and come to Rome, with promises of temples. They did it to Veii. They are recorded as doing it to [[carthage|Carthage]]. The Juno of Book I \u2014 who keeps her armour at Carthage and wants it to rule the world \u2014 is the goddess Rome talked into defecting.</p><p>So when she gives up in Book XII and asks for terms, she is not being defeated. She is being brought over. Every Roman in the room had been to her temple.</p>",

  "essence": "Aeneas's mother, lobbying heaven on her son's behalf with a competence that is not always distinguishable from cruelty.",
  "sections": [
   {
    "h": "The Mother",
    "body": "She meets her son on a beach in Africa after a shipwreck, dressed as a girl out hunting, with her hair loose and a bow. She asks him if he has seen her sisters. She will not say who she is.\n\nShe gives him directions, and a summary of [[dido|Dido]]'s life story, and a favourable omen about his missing ships, and she is turning to go when the disguise slips \u2014 her hair, her neck, the smell of her, the way she suddenly moves.\n\nAnd he says the bitterest thing he ever says to anyone: why do you keep mocking your own son with false shapes? Why can we never take each other's hand, or say a true word?\n\nShe does not answer him. She wraps him in a cloud so he can walk into the city unseen, and goes."
   },
   {
    "h": "The Fire",
    "body": "She does not trust [[dido|Dido]]'s hospitality, so she buys it. She takes her other son, [[cupid|Cupid]], and puts him in the shape of [[ascanius|the boy]] \u2014 the real child is drugged and carried off to a hillside to sleep \u2014 and sends him into the banquet to be held on the queen's lap.\n\nAnd Dido, having no idea, holds the god of desire against her body all evening, and cannot stop looking at him, and cannot stop looking at his father, and by the time the tables are cleared she is finished.\n\nLater, when [[juno|Juno]] proposes a marriage, [[venus|Venus]] sees exactly what it is and agrees on the spot, sweetly, and says nothing about [[jupiter|Jupiter]].\n\nThe poem's benign goddess \u2014 the mother, the one on our side \u2014 does that. It is worth sitting with."
   },
   {
    "h": "The Armour",
    "body": "When the war is coming, she goes to her husband. [[vulcan|Vulcan]] is the smith of the gods, who has been married to her for a long time and knows exactly what she is, and she winds her white arms round him and asks, softly, for armour.\n\nHe cannot refuse her, and the poem is dry about why.\n\nWhat comes out of the volcano is the [[shield|shield]] \u2014 and on it, hammered into the metal, is everything that has not happened yet. The she-wolf. The rape of the Sabines. Horatius. Hannibal's failure. And in the centre, Actium: [[augustus|Augustus]] on the deck with flames coming out of his temples, and Antony with an Egyptian wife, and the gods of Egypt \u2014 dog-headed Anubis \u2014 losing to Neptune and Venus and Minerva.\n\nShe hands her son a picture of the empire, and he cannot read a line of it, and he puts it on his shoulder."
   }
  ],
  "beneath": "<p>She is on our side, and she is not good, and the poem does not resolve that for you.</p><p>Count her interventions. She lies to her son's face. She drugs her grandson and swaps a god of desire into his place to destroy a woman who has done nothing but be generous. She agrees to a marriage she knows will kill [[dido|Dido]]. She lobbies [[jupiter|Jupiter]] with a speech that is technically a complaint about broken promises and functionally a threat.</p><p>Her love for [[aeneas|Aeneas]] is total, and it is the narrowest thing in the poem \u2014 it extends to exactly one bloodline and stops. Set her against [[juno|Juno]] and the difference is not moral. It is that one of them is backing the winner.</p><p>[[virgil|Virgil]] could have written a warm mother. The scene on the beach \u2014 <em>why can we never take each other's hand</em> \u2014 is him telling you he chose not to.</p>",
  "beyond": "<p>Venus is a political fact. The Julian family claimed descent from [[ascanius|Iulus]], and therefore from Aeneas, and therefore from her. Julius Caesar built a temple to <em>Venus Genetrix</em> \u2014 Venus the Ancestress \u2014 in the middle of his own forum and put her at the head of his family tree. [[augustus|Augustus]] inherited the claim with the name.</p><p>So when she wins her case in heaven, she is not a goddess in a story. She is the regime's great-great-grandmother, and everyone listening knows it.</p><p>Which raises a question Virgil leaves lying on the floor: if the divine ancestress of the ruling house is capable of what she does to [[dido|Dido]] in Book I, what exactly has the audience been told about the family?</p>",

  "essence": "A shy, sickly farmer's son who became the state poet of an empire, spent eleven years on this poem, and died asking for it to be burned.",
  "sections": [
   {
    "h": "The Man",
    "body": "Publius Vergilius Maro, born 70 BC on a farm near Mantua, in the flat country of the Po \u2014 which at the time was not, legally, Italy. He was a provincial. He did not get Roman citizenship as a birthright the way his readers did.\n\nHe was tall, dark, and rustic-looking, and people who met him were surprised by how unimpressive he was. He was chronically ill \u2014 stomach, throat, headaches, blood. He was so shy that when he was recognised in the street in Rome he would duck into the nearest house. In Naples, where he mostly lived, they called him <em>Parthenias</em>: the Maiden.\n\nHe never married. He wrote three books in his life and the first two are about farming."
   },
   {
    "h": "The Confiscation",
    "body": "After [[augustus|the young Octavian]] and Antony won at Philippi, they had to pay off tens of thousands of veterans, and they paid them in other people's land. Whole districts of Italy were confiscated and handed to soldiers. Mantua was in one of them.\n\nVirgil's family lost the farm, or nearly did \u2014 the sources disagree, and the poems do not clarify, and that is itself interesting. What is not in doubt is that his first book, the <em>Eclogues</em>, is about dispossession: shepherds sitting under a tree, one of whom has kept his land and one of whom is walking away from his forever, and the one who kept it saying, comfortably, that a god did this for him.\n\nThe man who would later write Rome's national epic began by writing about people whose homes the state took."
   },
   {
    "h": "Eleven Years",
    "body": "He worked on the <em>Aeneid</em> from about 29 BC to his death. He is said to have written a few lines each morning and spent the rest of the day cutting them \u2014 he described it himself, apparently, as licking them into shape the way a bear licks her cubs.\n\nHe read Books II, IV and VI aloud to [[augustus|Augustus]] and his sister Octavia. When he reached the passage about [[marcellus|Marcellus]] \u2014 Octavia's son, dead at nineteen, the emperor's chosen heir \u2014 she is said to have fainted in the room.\n\nIn 19 BC he set out for Greece, planning three years of revision. He met Augustus at Athens and was persuaded to turn back. He caught a fever at Megara, worsened on the crossing, and died at Brundisium on 21 September, aged fifty."
   },
   {
    "h": "Burn It",
    "body": "He wanted it destroyed. There is a story that he asked for the manuscript box on his deathbed so he could burn it himself, and was refused.\n\n[[augustus|Augustus]] overruled him and had it published by two of his friends, with a specific instruction: correct, but add nothing. That is why the poem still contains fifty-eight [[half_lines|half-lines]] \u2014 lines that simply stop, mid-breath, waiting for a second half that never came.\n\nWe read Virgil's poem against Virgil's explicit last wish. Every copy of it in the world is a small act of disobedience by the state."
   }

  "beneath": "<p>Why did he want it burned?</p><p>The safe answer, and probably the true one, is that it was not finished and he knew exactly which lines were bad. He was a perfectionist working on a scale that terrified him; the half-lines are real; three more years of revision was the plan, and he did not get them. A craftsman does not want to be seen with the scaffolding up.</p><p>The romantic answer is that somewhere in eleven years the poem got away from him \u2014 that he set out to write the founding of Rome and found, book by book, that he had written [[dido|a queen on a pyre]], a [[turnus|man begging on his knees]], and an ending in which the hero does the thing the whole poem condemns \u2014 and that he could not publish it and could not fix it.</p><p>I do not believe the romantic answer, and I want to say so plainly rather than let it sit here looking suggestive. It is too neat, it flatters the reading we already want, and there is no evidence for it. But I will say this much: the fact that it is even a plausible story about this poem, and would be an absurd story about almost any other commissioned national epic, tells you something true about what he actually wrote.</p>",
  "beyond": "<p>A Roman poet was not free and was not a servant. He was in a relationship, and the word for it was <em>patronage</em>. Virgil's patron was Maecenas, [[augustus|Augustus]]'s cultural fixer, who kept a circle that also included Horace. Maecenas gave money, security, houses, and access. What he wanted back was not propaganda exactly, but a literature adequate to the new regime.</p><p>You can watch the pressure rise across the career. The <em>Eclogues</em>: shepherds, dispossession, a golden age coming. The <em>Georgics</em>: four books on farming, bees, and grafting, written after a century of civil war had emptied the fields \u2014 a poem about putting the country back together, with a grief in it you can hear. Then the <em>Aeneid</em>, which is the whole thing.</p><p>And then, immediately, the schoolroom. Within a generation of his death, Roman children were being drilled in Virgil the way English children were once drilled in Shakespeare. Graffiti scratched on walls in Pompeii quotes the opening line \u2014 <em>arma virumque cano</em>, I sing of arms and the man \u2014 in the handwriting of people practising their letters. He became furniture almost instantly, which is [[long_echo|its own kind of damage]].</p>",

  "sections": [
   {
    "h": "The Boy Who Won",
    "body": "He was eighteen and studying in Illyria when the news came that his great-uncle had been stabbed to death in the senate house, and that the will had adopted him.\n\nWhat followed was thirteen years of the worst thing Rome ever did to itself. He and Antony and Lepidus took power and paid for it with the <em>proscriptions</em>: lists of Roman citizens posted in public, whose lives were forfeit and whose property was seized, with a bounty for anyone who brought a head. Hundreds of senators. Two thousand of the equestrian class. Cicero was on the list; his hands, which had written the speeches, were nailed up in the forum.\n\nThen Philippi. Then a siege at Perusia where the town was starved out, and the stories afterward were ugly. Then, in 31 BC, off the coast of Greece at Actium, he beat Antony's fleet, and there was nobody left to fight."

   {
    "h": "The Peace",
    "body": "And then he did the thing nobody expected. He stopped.\n\nHe gave the Republic back \u2014 formally, in a speech, in 27 BC \u2014 and the senate, deeply relieved and entirely unfooled, gave him a new name: Augustus, the revered one. He kept the armies. He held the offices under other titles. He called himself <em>princeps</em>, the first citizen, and ruled for another forty years.\n\nAnd there was peace. That is not propaganda; it is just true. He shut the gates of the temple of Janus, which are closed only when Rome is at war with nobody, and they had been shut twice in seven hundred years. He rebuilt the temples. He put up the Altar of Peace. He said he had found Rome brick and left it marble.\n\nThe generation reading the <em>Aeneid</em> had grown up under a century of Romans killing Romans, and it had stopped, and he was the one who stopped it, and he was the one who had done most of it."
   },
   {
    "h": "In the Poem",
    "body": "He is in it three times, and the placements are not subtle.\n\n[[jupiter|Jupiter]] in Book I, promising an empire without end, arrives at a Caesar who will bound his empire by the ocean and his fame by the stars.\n\n[[anchises|Anchises]] in the underworld, showing the unborn Romans, points him out: here is the man, so often promised to you, who will bring back the golden age.\n\nAnd on the [[shield|shield]], at Actium, standing on the high stern with flames pouring from his temples and his father's star over his head \u2014 the whole senate and people of Rome behind him, and against him Antony with the wealth of the East and an Egyptian wife, and the monstrous gods of Egypt, and dog-headed Anubis raising weapons against [[venus|Venus]] and Neptune and Minerva.\n\nIt is the most propagandistic passage [[virgil|Virgil]] ever wrote, and he made sure that the man carrying it does not understand what it means."

  "beneath": "<p>The uncomfortable question is not whether Virgil admired him. He almost certainly did, and so did most of Rome, and they had reason to.</p><p>The question is what the poem does with him. It puts him at the end of a line that begins with [[aeneas|a man]] who kills a begging Italian in a rage. It gives the ancestral virtue \u2014 <em>[[pietas|pietas]]</em>, which was Augustus's own stamped-on-the-coins brand \u2014 to a hero who abandons it in the last four lines. It makes the founding of Rome cost [[dido|a woman on a pyre]], [[pallas|a boy]], [[camilla|a girl]], [[amata|a queen]]. And it does all of that in a poem the man paid for.</p><p>You can read this as loyal honesty: an empire is expensive, we should be adult about it, and here is the bill, respectfully submitted. You can read it as something else. I am going to tell you which way I lean and let you discount it \u2014 I think Virgil was too intelligent not to know what he had written, and too loyal to say so, and that the poem is the shape of a man holding both.</p><p>What is not in dispute: Augustus read Books II, IV and VI aloud in a room. He knew what was in them. And he ordered the poem published against the poet's dying wish, uncut.</p>",
  "beyond": "<p>Augustus wrote his own version too. The <em>Res Gestae</em> \u2014 \u201cThings Done\u201d \u2014 was carved on bronze pillars outside his mausoleum and copied on temple walls across the empire, and it is a masterpiece of a particular kind: forty paragraphs of achievements in the first person, in which the proscriptions do not appear, the civil war is described as suppressing a faction, and everything he seized is something the senate freely gave.</p><p>Read next to that document, the <em>Aeneid</em> is a strange thing for the same regime to have produced. The <em>Res Gestae</em> has no cost in it anywhere. The poem is almost entirely cost.</p><p>And there is [[marcellus|Marcellus]]. Augustus had no son. He chose his nephew, married him to his daughter, and the boy died at nineteen. Virgil put him in the parade of Rome's future, walking under a black cloud, and read it aloud with the boy's mother in the room. The empire without end could not produce an heir.</p>",

  "sections": [
   {
    "h": "The Weight",
    "body": "He is old, and he cannot walk, and when [[troy|Troy]] is burning he will not leave. He sits in his chair and tells his son to go without him \u2014 he has lived long enough, he says, and been struck by lightning once already, and the gods can finish the job.\n\nThey argue in a burning house. [[aeneas|Aeneas]] picks up his sword to go out and die instead. And then a small flame settles in [[ascanius|the boy's]] hair, licking his temples, not burning him \u2014 and the old man, who has spent the entire scene wanting to die, lifts his hands and asks for a second sign, and gets thunder on the left, and changes his mind about everything.\n\nSo he is carried out on his son's shoulders, holding the household gods, because Aeneas's hands are bloody and may not touch them.\n\nAnd then for three books he is the navigator, and he is wrong. Seek your ancient mother, the oracle says, and he says confidently: Crete. It is not Crete. They build a town, name it, start ploughing, and a plague kills the crops and the people before the household gods appear at night to correct him.\n\nHe dies in Sicily, quietly, offstage, in a single line. His son does not describe it."
   },
   {
    "h": "The Parade",
    "body": "He is more use dead. Down in the fields of light, among the souls waiting to be born, he is standing at the far end of a green valley counting his descendants.\n\nAnd he shows [[aeneas|his son]] the future: the Alban kings, Romulus, [[augustus|Augustus]] \u2014 here is the man, so often promised to you, who will bring back the golden age. Then a long queue of names. Then a boy walking under a black cloud, and his father asks who that is, and the answer is [[marcellus|Marcellus]].\n\nAnd then the instruction, the one Rome would quote for two thousand years. Others will beat out bronze more softly. Others will plead cases better. Others will chart the stars. You, Roman \u2014 remember what you are for. Rule the peoples. Impose the habit of peace. Spare the conquered, and war down the proud.\n\nThen he walks his son to a gate and sends him back up through [[gates_of_sleep|the ivory one]]."

  "beneath": "<p>He is the poem's most trusted voice, and he gets everything wrong.</p><p>He misreads the oracle and people die of it. He tells [[aeneas|his son]] a future that is entirely triumph and contains not one word about the cost \u2014 no [[dido|Dido]], no [[pallas|Pallas]], no [[turnus|Turnus]], no [[creusa|Creusa]]. He hands over an instruction (<em>spare the conquered, war down the proud</em>) that is beautiful, quotable, and completely useless at the only moment it is ever tested \u2014 because at the end [[turnus|the man on the ground]] is both conquered and proud, and Aeneas has to choose, and he has no help.</p><p>And then his son leaves through the gate of false dreams.</p><p>The parade of heroes is the most Augustan passage in the poem and it is delivered by a ghost who has been unreliable since Book III, to a man who cannot use it, and it exits through the wrong door. That may be nothing. [[virgil|Virgil]] arranged all three.</p>",

   {
    "h": "The Boy",
    "body": "He is small enough that on the night [[troy|Troy]] falls his father has to shorten his stride to hold his hand \u2014 the poem says it exactly like that, and it is the tenderest line in Book II.\n\nA flame sits in his hair and does not burn him, and that is the sign that saves the family.\n\nHe grows up on ships. In Sicily he leads a mounted display for his grandfather's funeral games \u2014 boys on ponies, weaving in patterns \u2014 and it is charming, and it is also a drill, and [[virgil|Virgil]] notes that Romans still perform it.\n\nAnd in Book VII, in Italy, he shoots a stag. It is a tame one \u2014 a farm girl's pet, combed in the evenings, coming home to be fed \u2014 and [[allecto|a Fury]] put the scent in front of his dogs. He does not know. He is a boy who saw a big animal.\n\nThat is the arrow that starts the war."

  "beyond": "<p>His other name is Iulus, and that name is the whole point.</p><p>The Julian family \u2014 Julius Caesar's, and by adoption [[augustus|Augustus]]'s \u2014 claimed descent from him, and therefore from [[aeneas|Aeneas]], and therefore from [[venus|Venus]]. This was not private family lore. Caesar said it out loud in a funeral speech for his aunt: our house goes back to kings on one side and to the immortal gods on the other. He then built a temple to Venus the Ancestress in the middle of his new forum.</p><p>So when a small boy holds his father's hand in a burning street, an audience in [[augustus|Augustus's]] Rome is watching the emperor's family survive. Every reader knew what the child was for.</p><p>Which is why the stag matters more than it looks. The dynasty's founding child fires the shot that starts the war \u2014 by accident, without malice, at the prompting of a Fury. [[virgil|Virgil]] gave that arrow to Iulus. He could have given it to anyone.</p>",

    "body": "She is a daughter of [[priam|Priam]], which makes her a princess of a city that has three hours left.\n\nOn the last night [[aeneas|her husband]] puts his father on his shoulders and his son by the hand, and tells her to follow at a distance, and to meet them at the old temple outside the walls, by the cypress.\n\nHe gets there. He counts. Everyone is there but her.\n\nSo he puts the armour back on and goes back into the fire, and runs the streets calling her name \u2014 he filled the streets with shouting, he says, over and over, in a city full of Greeks, and did not care who heard.\n\nAnd then she is standing in front of him, and she is larger than she was in life.\n\nShe tells him it was not permitted. She tells him there is a long exile ahead, and a great deal of sea, and then a kingdom in the west and a royal wife. She tells him not to weep for her, and that she will not be dragged off to be a slave in a Greek house. Three times he tries to put his arms round her neck. Three times the image goes through his hands like wind, like something in a dream."

  "beneath": "<p>She is the first entry in the ledger and the most efficiently written. Four lines of instructions, a search, a ghost, and she is gone \u2014 and the ghost does the poem's administrative work for it. She tells him a foreign bride is waiting. She tells him not to grieve. She removes herself, and gives him permission, and clears the way to [[lavinia|Lavinia]].</p><p>Notice what she is not allowed to be. She is not angry. She does not ask why he was in front. She has no complaint at all, and she is the only major casualty in the poem who does not \u2014 [[dido|Dido]] curses, [[turnus|Turnus]] groans, [[camilla|Camilla]]'s life leaves resentful. Creusa says: be kind to our son.</p><p>It is a very convenient ghost. Whether that convenience is [[virgil|Virgil]] tidying, or Virgil showing you a man remembering the version he can live with \u2014 remember, [[aeneas|Aeneas]] is narrating this himself, at a dinner party, to a woman he is about to do it to again \u2014 is a real question, and the poem does not close it.</p>",

  "beneath": "<p>The blush is the most famous four lines in the poem that nobody can agree about, and the disagreement is the point.</p><p>If she loves [[turnus|Turnus]], then the marriage that founds Rome is a forced one, and the last book is a girl watching her man walk out to be killed by her husband-to-be. If she is frightened, she is a child being fought over. If she is ashamed, she has understood the whole thing better than anyone else in the room.</p><p>What is not arguable is that [[virgil|Virgil]] spent his descriptive power here, on a silent woman, at the exact moment the war is decided \u2014 and gave her a simile about ivory and lilies, which are the materials of things that get carved and cut.</p><p>She is the prize. She founds the Roman line. She never speaks. That is not an oversight in a poem this careful.</p>",

  "sections": [

    "h": "The Snake and the Rope",
    "body": "She wants her daughter to marry [[turnus|Turnus]], who is a good match, whom she loves, and who is not a foreigner. It is a mother's ordinary position, and she is holding it in a room with a king who has already agreed to something else.\n\nThen [[allecto|the Fury]] pulls a snake out of her own hair and puts it into her clothes, and it goes into her without a wound, and turns her into a thing the poem compares to a spinning top under a whip \u2014 running through the woods with her daughter, screaming that the marriage is unlawful, hiding [[lavinia|the girl]] in the hills, calling out the other mothers of the city to come with her.\n\nBy Book XII the walls are being scaled. She is up in the palace watching the field, and she cannot see Turnus anywhere in it, and she decides he is dead, and that it is her fault, because she is the one who wanted this.\n\nShe calls herself the cause of all of it. Then she goes inside and knots the purple hangings into a noose."

  "beneath": "<p>Nobody mourns her. That is the fact to sit with.</p><p>[[lavinia|Her daughter]] tears her hair. [[latinus|Her husband]] walks through the streets with dust in it. And then the poem moves on to the duel and she is never mentioned again \u2014 not at the wedding, not in the settlement, not by anyone.</p><p>She is infected with a war she did not start, made to want it harder than anyone, and then killed by the belief that she caused it. Which she did, and did not. Both.</p><p>And here is the ugly symmetry the ledger exposes: [[dido|Dido]] and Amata are the two suicides in the poem, and both are women, and both are destroyed by a marriage that [[juno|Juno]] arranged in order to inconvenience Rome, and neither death buys anything. Juno's method, across twelve books, is to reach for a woman.</p>",

  "sections": [
   {
    "h": "The Gold Breastplate",
    "body": "Her father was a tyrant, chased out of his own city with a baby in his arms, and when he came to a flooded river with a mob behind him he tied her to his spear, promised her to the goddess of the hunt, and threw her across.\n\nShe grew up in the woods on mare's milk. She never learned to spin. She could run over a field of standing wheat, [[virgil|Virgil]] says, without bending the ears of corn, and over the open sea without wetting her feet. Mothers wanted her for their sons and she wanted nothing but her spear.\n\nShe leads the Latin cavalry, and for most of a book nothing can touch her.\n\nThen she sees a Trojan priest called Chloreus, dressed the way a man dresses when he has never had to fight \u2014 saffron and purple, a gilded bow, bronze scales worked with gold \u2014 and she wants it. She goes after him across the whole field, blind to everything else.\n\nArruns has been circling her for an hour, waiting. He throws while she is looking at the gold.\n\nIt goes in under the exposed breast. She reaches for the shaft and cannot get it out. Her friends catch her as she goes down. She starts to give an order about the battle and does not finish it \u2014 and her life fled, resentful, with a groan, into the shades."

  "beneath": "<p>Two things here, and one of them is [[virgil|Virgil]] being unkind.</p><p>He kills her with a line of commentary: she was hunting the gold, he says, with a woman's love of spoil and finery. It is the only genuinely cheap sentence in the poem. He has just spent a hundred lines making her the most thrilling figure in the second half \u2014 and then explains her death by her sex, in a poem where [[turnus|Turnus]] dies for taking [[baldric|a belt]] and nobody says a word about men and their trophies.</p><p>You can defend it. The parallel is exactly the point: Camilla dies for wanting gold and so, in the end, does Turnus, and the poem is showing you that the appetite for spoil is what kills everyone. But Virgil says it out loud about her and stays silent about him, and that asymmetry is his, not mine.</p><p>And the other thing. Her last line \u2014 <em>her life fled, resentful, with a groan, into the shades</em> \u2014 is the last line of the whole poem, word for word, and it will belong to [[turnus|Turnus]]. She dies the death the <em>Aeneid</em> ends on. Virgil wrote it here first, quietly, in the middle of a cavalry skirmish, so that when you hear it again you will already know what it means.</p>",

  "sections": [
   {
    "h": "The Man Who Despised the Gods",
    "body": "His own city threw him out, and they had cause. He used to tie living men to corpses \u2014 face to face, hand to hand \u2014 and leave them to die slowly of the embrace. That is one sentence in the poem and it is enough.\n\nHe is called the despiser of the gods, and he means it: he tells his own right hand and his own spear that they are the only gods he has ever needed.\n\n[[aeneas|Aeneas]] puts a spear into his groin and he is dragged out of the fight by his men. And then [[lausus|his son]] steps into the gap and holds Aeneas off, and Aeneas kills him.\n\nThey bring the boy's body to where the old man is washing his wound in the river.\n\nAnd he says: was I so in love with living that I let my son stand in for me? Is this what your father's crimes bought you \u2014 to be killed for me? He calls himself the only stain on the boy's name, and says he has been thrown out of every place he ever had and hated everywhere and has stayed alive too long.\n\nThen he calls for his horse, who has carried him for years and whom he talks to like a friend, and asks it for one more ride \u2014 we will either bring back the head of the man who did this, or we will die together, because you are too proud to take a Trojan master.\n\nAnd he rides at [[aeneas|Aeneas]] three times, and is killed, and asks only to be buried where his people cannot get at his body."

  "beneath": "<p>He is the poem's monster and he is given the most unbearable grief in it, and that order is deliberate.</p><p>[[virgil|Virgil]] establishes the atrocity first \u2014 the living tied to the dead \u2014 so that you cannot possibly be on his side. And then he kills the man's son in front of him, and gives him a father's mourning so exact that you have no idea where to put your sympathy, and the poem walks away without helping you.</p><p>Notice the shape. The man who despises the gods dies of [[pietas|pietas]] \u2014 of a son's devotion, which he did not deserve and did not ask for. And the man who <em>is</em> pietas, [[aeneas|Aeneas]], is the one who put the sword in the boy. The poem's central virtue kills the person who has it and lands, hard, on the person who does not.</p><p>The horse is the last touch. He is going out to die, and the last conversation he has is with an animal, about who deserves to own it.</p>",

  "sections": [

    "h": "The Village on the Hill",
    "body": "He is a Greek, and an exile, and he is very old, and he is king of a few huts and a herd of cattle on a hill above the Tiber. The place is called Pallanteum. It will be called the Palatine.\n\nHe walks [[aeneas|Aeneas]] round it \u2014 through a wood that will be an asylum, past a cave that will be a shrine, up a slope where the cattle are lowing in what will be the Roman Forum \u2014 and he tells him the old stories about each place, and points out the ruins of two towns that were there before his.\n\nAnd he takes him home to a small house and gives him a bed of leaves and a bearskin, and tells him: dare to despise wealth, and make yourself worthy of a god.\n\nHe has one son, [[pallas|Pallas]], and no cavalry to spare, and he gives both. He asks [[aeneas|Aeneas]] to teach the boy war, and to bring him back. He holds on to him at the gate and cannot let go, and faints, and is carried inside."
