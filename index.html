  "half": "The Wandering",
  "k": "Book III",
  "g": "seven years of wrong landfalls",
  "h": "The prophecies they keep misreading",
  "s": "They land in Thrace, and [[aeneas|Aeneas]] pulls at a shrub to dress an altar, and it bleeds. A voice comes up out of the mound: why are you tearing me? I am [[polydorus|Polydorus]]. An iron crop of spears grew here out of my body.\n\nThey leave the same day.\n\nAt Delos the oracle tells them to seek their ancient mother. [[anchises|Anchises]] says, confidently: Crete. It is not Crete. They build a whole town there, name it, start ploughing \u2014 and a plague comes and kills the crops and the men, and the household gods have to appear at night to explain that the answer was Italy, and always was.\n\nOn a stinking island a harpy lands on a rock above them and curses them: you will get to Italy, but hunger will make you eat your own tables before you build a single wall.\n\nAnd they sail on for seven years like this, being told the truth in a language nobody can read until afterwards.",
  "stage": "<p>Book III is the least loved book in the poem and the one that tells you most about how it works.</p><p>Structurally it is the <em>Odyssey</em> compressed \u2014 monsters, islands, a Cyclops, a bad prophecy, a strange kingdom \u2014 and [[virgil|Virgil]] does the whole thing in one book, fast, almost impatiently, as if he wants it behind him.</p><p>And the harpy's curse is the poem's one real joke, held for four books. <em>You will eat your tables.</em> It sounds like starvation and cannibalism. What actually happens, in Book VII, is that they run out of plates and eat the flat bread they were using as trenchers, and [[ascanius|the boy]] laughs and says: look, we're eating our tables \u2014 and everyone goes very quiet, because that was the sign, and they have arrived. The most frightening prophecy in the poem turns out to be a picnic.</p>",
  "turns": "<p>What turns here is your idea of what a prophecy is for.</p><p>[[fatum|Fate]] in this poem is fixed, and known, and announced constantly \u2014 and it is no help at all. It does not make anything easier. It only makes it certain. [[anchises|Anchises]], the most trusted voice they have, misreads the central oracle and a colony dies of plague, and he never mentions it again.</p><p>Hold on to that when you get to Book VI and he shows his son seven hundred years of the future.</p>"
 },
 {
  "bk": 3,
  "h": "A little Troy, and a father who dies offstage",
  "half": "The Wandering",
  "k": "Book III",
  "g": "the temptation to live in the past",
  "s": "At Buthrotum they find the strangest thing in the poem.\n\nTwo Trojan survivors have built a scale model of the lost city. A little [[troy|Troy]]. A dry riverbed they have named the Xanthus. A gate they call the Scaean gate, because the real one had that name. A fake citadel.\n\nAnd there, in the woods by a false river, is Hector's widow \u2014 married now to her dead husband's brother \u2014 making offerings at an empty tomb with her husband's name on it. She sees [[ascanius|the boy]] and asks whether he is about the age her own son would have been, and starts crying, and cannot stop.\n\n[[aeneas|Aeneas]] walks around it. He is polite. He accepts gifts. They give him good advice about the route.\n\nAnd he leaves, and he never says one word about what he thought of it.\n\nThen Sicily, and the sea behind them, and the worst of it over. And his father dies.\n\nHe has been telling this entire story out loud, at a dinner table, for two books. And when he reaches this he says: here, after all the storms, I lost my father, my comfort in every trouble. Here you left me, best of fathers \u2014 saved from so much danger, for nothing.\n\nAnd then the poem says: he stopped. Having finished, he was silent.",
  "stage": "<p>Buthrotum is [[virgil|Virgil]]'s answer to a question the poem cannot afford to ask out loud: <em>why not just stop?</em></p><p>They have been at sea for years. Here is a Trojan city, built by Trojans, with a Trojan king, safe, functioning, and finished. Everything [[aeneas|Aeneas]] says he wants. And it is a museum \u2014 a doll's house with a dry river, tended by a woman weeping at a grave with nobody in it.</p><p>He does not argue with it. He does not condemn it. He just goes. It is the most restrained piece of writing in the first half, and it is doing something that would take an essay to say: the past can be rebuilt, and if you rebuild it you are dead.</p>",
  "turns": "<p>The father's death is the hinge, and the way it is written is the point.</p><p>[[anchises|Anchises]] does not get a scene. He does not get last words, or a description, or a deathbed. The most eloquent narrator in Latin literature \u2014 who has just spent two books giving us serpents, and a burning city, and a wife's ghost \u2014 arrives at his own father's death and produces four lines and a full stop.</p><p>He cannot do it. That is the whole characterisation, and [[virgil|Virgil]] achieves it by writing nothing.</p><p>And note the cost accounting: he had to die. [[aeneas|Aeneas]] cannot be sent to the underworld to be shown the future unless there is somebody down there worth going to see.</p>"
 },
 {
  "bk": 4,
  "half": "The Wandering",
  "k": "Book IV",
  "g": "the hunt, the cave, the rumour",
  "h": "Two goddesses arrange a marriage neither of them believes in",
  "s": "It starts with a confession at dawn. [[dido|Dido]] tells her sister [[anna|Anna]] that she recognises the old fire \u2014 the one she swore off at [[sychaeus|Sychaeus]]'s grave \u2014 and that she would rather the earth swallowed her than break that vow. And then she says his name, and Anna hears everything in the way she says it.\n\nAnna is kind, and reasonable, and catastrophic. What good is grief to the dead? A young queen, alone, with the Gaetulians and the Numidians and [[iarbas|Iarbas]] all around her, and a Trojan fleet sitting in her harbour \u2014 think what Carthage could be with those ships behind it. It is exactly the advice a loving sister gives. It is also permission, and Dido has been waiting for permission.\n\nAbove them, out of sight, the goddesses are talking. [[juno|Juno]] proposes it like a treaty: let them marry, end the wandering, one people, a shared throne. [[venus|Venus]] sees straight through it \u2014 this is an attempt to plant Rome in Africa and strangle it there \u2014 and agrees on the spot, sweetly, because she knows [[jupiter|Jupiter]] will never allow it and would rather Juno discovered that for herself. Neither of them mentions Dido.\n\nSo the hunt goes out at dawn. Horses stamping in the gateway, purple and gold, the queen in a stiff embroidered cloak with her hair in a gold clasp, [[ascanius|Ascanius]] riding hard and wishing aloud that something bigger would come down off the mountain.\n\nThen the sky goes black. Hail. The party breaks apart down the hillsides and the water comes off the rocks in sheets, and Dido and the Trojan leader arrive at the same cave. Earth moves first. Then Juno, who has charge of marriages. Lightning stands where the wedding torches should be. The sky is the witness, and on the ridge above them the mountain nymphs scream.\n\nThat day was the first cause of death, and the first cause of everything.",
  "stage": "<p>Watch the poem borrow, and then swerve. The hunt, the storm, the cave is lifted whole out of Apollonius's <em>Argonautica</em>, where Jason and Medea marry in a cave \u2014 and every educated Roman in the room knew it, and knew that the Medea story ends with a woman killing her own children. [[virgil|Virgil]] is not decorating. He is telling you what kind of story you have walked into.</p><p>The four cave lines are the most compressed in the poem and they are built to be unstable. There is no verb of marrying anywhere in them. There is a sky, a fire, a witness and a cry \u2014 all the furniture of a Roman wedding, with the wedding taken out. And Roman marriage really was a matter of consent and intention rather than ceremony, which is why the question of what happened in that cave is a legal one and not a romantic one, and why the poem will not answer it.</p><p>Then Rumour: a full epic set-piece, twenty lines, a monster who walks the earth with her head in the clouds and sings the true and the invented in the same voice. That is not a digression. That is the poem telling you what actually kills [[dido|Dido]] \u2014 not the cave, but the story about the cave.</p>",
  "turns": "<p>This is the hinge of the first half. Before the cave, [[aeneas|Aeneas]] is a refugee who might still settle anywhere. After it, the machinery closes: he cannot stay, she cannot survive his going, and the hatred that produces Hannibal is loaded.</p><p>The moment to watch is [[venus|Venus]] saying yes. She is not tricked. She agrees to a marriage she knows heaven will cancel, because letting [[juno|Juno]] waste the effort is cheaper than fighting her. [[dido|Dido]]'s life is the acceptable cost of an argument between in-laws.</p><p>And the irony a first reader will miss: Dido's vow to [[sychaeus|Sychaeus]] is the same virtue Aeneas is praised for \u2014 [[pietas|loyalty to the dead]], kept past reason. She breaks hers for him. He keeps his by leaving her. Same value, two people, and it destroys exactly one of them.</p>"
 },
 {
  "bk": 4,
  "half": "The Wandering",
  "k": "Book IV",
  "g": "the order, and the argument",
  "h": "He decides to tell her gently, and she finds out anyway",
  "s": "[[iarbas|Iarbas]] hears it with his hands on the altar and prays in a fury of wounded vanity: is this what I built you a hundred temples for \u2014 a woman who wandered into my country, bought a strip of my coast, refused my offer, and has now taken a perfumed Trojan into her house?\n\n[[jupiter|Jupiter]] turns and looks down, and what he sees is the future founder of Rome supervising street plans in a purple cloak that [[dido|Dido]] embroidered for him herself, with a jewelled sword on his hip.\n\n[[mercury|Mercury]] comes down the sky and delivers a message that is mostly contempt. What are you doing. Building a beautiful city for a wife. Forgetting your own kingdom, your own business. And if none of your own glory moves you \u2014 think of the boy, and the Italy you owe him. [[aeneas|Aeneas]] is struck dumb, his hair standing up, his voice stuck. He burns to go.\n\nAnd then he does the thing readers have never forgiven. He tells the captains to ready the fleet quietly \u2014 arm them, cover the reason, keep it from her \u2014 while he looks for the gentlest opening, the best moment to raise it. He is going to manage her.\n\nShe knows within a day. Who ever fooled a lover?\n\nThe argument runs three hundred lines and she wins every point except the one that matters. Did you think you could hide this from me? Am I nothing \u2014 not the hand I gave you, not Dido dying? She has burned her name for him; her own people despise her now; Iarbas is waiting. And then she stops arguing and asks for one thing. Leave me a child. If there were even a small Aeneas playing in the hall, with your face, I would not feel completely taken and completely abandoned.\n\nHe stands there with his eyes down. He never held a wedding torch. He never entered into that contract. If fate had let him choose he would still be in [[troy|Troy]], rebuilding it for the dead. A god ordered him. Italy is not his desire; Italy is his duty. Stop setting us both on fire. I go to Italy against my will.\n\nShe hears him out. Then: you are no son of a goddess. Rocks made you. Tigers nursed you. And she is carried out fainting, while he \u2014 longing to soothe her grief \u2014 goes back to the ships.",
  "stage": "<p>Two Roman machines are running at once here. Formally, Dido's speech is a <em>suasoria</em>, the rhetorical set-piece Roman schoolboys were drilled in, where you argue a man out of a course of action. Hers is technically magnificent: it opens on their bond, escalates to threat, retreats into pathos, and closes on the smallest possible request. She does everything the textbook says.</p><p>And [[aeneas|Aeneas]] answers like a defendant. Point by point, in legal language, on the narrow question of whether a marriage legally existed. His defence is that no contract was made. He is not wrong. He is answering an argument she is not having.</p><p>The failure is deliberate, and it is not only his. [[virgil|Virgil]] gives Dido the poetry and Aeneas the case, and then makes you watch a man win an argument he ought to lose, in a courtroom nobody agreed to enter.</p>",
  "turns": "<p>What turns here is your relationship with the hero. Until now [[aeneas|Aeneas]] has been a man things happen to. This is his first real decision, and it is a small cowardice \u2014 not the leaving, which he has no choice about, but the plan to slip out quietly and break it to her afterwards. [[virgil|Virgil]] could have cut that. He put it in.</p><p>Watch the word <em>[[pietas|pius]]</em>, which the poem has been hanging on him like a title. [[dido|Dido]] throws it back at him with contempt. From this book on, the epithet gets quieter \u2014 and by the last page it is gone.</p><p>And note the thing he does not say. She asks whether he is fleeing <em>her</em>. He says he is going to Italy. He never says he does not love her, and he never says he does. The poem leaves that blank, and no reading of the <em>Aeneid</em> is finished until you decide what is in it.</p>"
 },
 {
  "bk": 4,
  "half": "The Wandering",
  "k": "Book IV",
  "g": "the pyre, and the curse",
  "h": "She tells them she is burning his things",
  "s": "She tries the small things first. She sends [[anna|Anna]] to ask for a delay \u2014 not the marriage, not any more, just a season, just until the sailing is easier, just time to learn how to lose. Anna goes back and forth with the messages. It changes nothing. He is an old oak in a gale: the leaves come down, the trunk does not move. And tears fall in vain.\n\nThen the omens start, and they are domestic and horrible. The holy water in the bowl goes black. At night she hears [[sychaeus|Sychaeus]] calling her name out of the shrine, and an owl on the roof going on and on.\n\nSo she has a pyre built in the inner courtyard, and tells her sister it is a rite \u2014 a priestess from the far west taught it, it will bring him back or set her free \u2014 and asks her to help stack it with his clothes, and the bed, and the sword he left. Anna helps her build it. Anna does not understand what she is helping to build, and neither does anybody reading it for the first time.\n\nAt dawn she is on the tower. The harbour is empty. The sea is full of sails.\n\nLet an avenger rise out of my bones and hunt them with fire and iron \u2014 now, or later, whenever the strength comes. Shore against shore, wave against wave, weapons against weapons. Them, and their children, and their children's children.\n\nThen she climbs the pyre, and takes up the sword. A Trojan sword. A gift. Never bought for this.\n\nI have lived. I have run the course that fortune gave me. I built a famous city. I saw my own walls. I avenged my husband and I punished my brother. Happy \u2014 too happy \u2014 if only the Trojan keels had never touched my shore.\n\nThe scream goes up through the house. [[anna|Anna]] comes through the crowd tearing at her own face, gets her arms under her, tries to stop the blood with the hem of her dress. Three times [[dido|Dido]] pushes herself up onto her elbow. Three times she falls back. She looks for the light, and finds it, and groans.\n\nShe is three days dying, because she is not owed this death \u2014 not by fate, and not by any crime \u2014 and the underworld has no slot for her. In the end it is [[juno|Juno]], who arranged all of it, who pities her, and sends someone down to cut the lock of hair that lets a soul go.",
  "stage": "<p>[[virgil|Virgil]] slows down here, and the slowness is the technique. The three-day death is not sensationalism; it is a point about the rules. [[dido|Dido]] dies before her day \u2014 not by fate, not as a punishment \u2014 and the machinery of the universe has no procedure for her. Proserpina has not claimed the lock; the soul cannot get out of the body. The poem has to send a goddess down to do the paperwork.</p><p>The curse is a real Roman form: <em>devotio</em>, in which a person consecrates themselves and their enemy to the gods below. It had actual words and an actual ritual, and a Roman audience heard the register change the moment she started using it.</p><p>And the pyre is the poem's signature doing its work. [[troy|Troy]] burned. The ships will burn in Sicily. Here a queen builds her own fire out of a man's abandoned wardrobe. The <em>Aeneid</em> is bracketed by fires, and this is the one that was lit on purpose.</p>",
  "turns": "<p>Everything the poem later celebrates is paid for here. That is the argument of this whole app in a single book: the empire without end that [[jupiter|Jupiter]] promised in Book I is being financed, in Book IV, by a woman on a pyre in a courtyard.</p><p>The moment to watch is the sword. He left it behind as a gift \u2014 an ordinary, thoughtless, affectionate thing to leave a person. She uses it. This poem is very interested in objects that come back wrong, and this is the first. [[baldric|A boy's sword-belt]] is the last, and it will end the poem.</p><p>And what turns for Rome: the [[punic_wars|Punic Wars]] are lit here. [[virgil|Virgil]] has taken the defining trauma of Roman history \u2014 Hannibal in Italy, a hundred and eighteen years of war, a city ploughed under \u2014 and given it a cause that makes Rome the guilty party. Nobody asked him to do that. It is the strongest single piece of evidence that the poem is not simply the thing it was commissioned to be.</p>"
 },
 {
  "bk": 5,
  "half": "The Wandering",
  "k": "Book V",
  "g": "the poem's one exhale, and a fire",
  "h": "Sport, and the women who burn the ships",
  "s": "A year to the day since [[anchises|his father]] died, and they are back in Sicily, and [[aeneas|Aeneas]] holds funeral games. It is the only time the poem relaxes.\n\nThere is a boat race, and it is genuinely funny \u2014 a helmsman thrown overboard for cutting a corner too wide, spitting seawater off a rock while everybody laughs; a captain who wins by praying. There is a footrace decided by a man slipping in a pool of sacrificial blood and deliberately tripping the runner behind him so his friend can win. There is a boxing match between a young champion and an enormous old man who has not fought in years, and the old man kills an ox with one punch afterwards to make a point.\n\nAnd there is a display of horsemanship by the boys \u2014 [[ascanius|Ascanius]] leading them, weaving in patterns, a drill dressed as a game.\n\nAnd then, down at the beach, while everyone is watching, [[juno|Juno]] sends a messenger to the Trojan women.\n\nThey have been at sea for seven years. They are sitting on the sand looking at the ships and crying, and they say aloud what nobody else in the poem will say: so many waves still to cross, so much sea. And the goddess puts a torch in their hands, and they burn the fleet.\n\nFour ships are lost. [[aeneas|Aeneas]] stands there and asks [[jupiter|Jupiter]], out loud, to either save the ships or kill him now.\n\nAnd that night, at sea, the god of sleep comes for [[palinurus|the helmsman]].",
  "stage": "<p>Funeral games are inherited furniture \u2014 [[homer|Homer]] has them for Patroclus \u2014 and [[virgil|Virgil]] uses them as the only comic register in the poem. It is the one place where wit is allowed, and he takes it: the poem is genuinely light here, and the crowd laughs, and it is a relief so calculated you can feel the author deciding you need one.</p><p>Every event is also, quietly, a Roman institution. The boys' cavalry drill is the <em>lusus Troiae</em>, the Game of Troy, which [[augustus|Augustus]] revived and staged in the Circus \u2014 and Virgil says so in the text, in the present tense: they still do it now. He is reaching out of the mythic past to touch something the audience saw last summer.</p><p>And then he burns the ships, four hundred lines after the joke about the boxer.</p>",
  "turns": "<p>The women are the only people in the <em>Aeneid</em> who say the unsayable, and the poem punishes them for it immediately.</p><p>Their complaint is unanswerable. Seven years. Four fleets' worth of dead. A city that keeps being somewhere else. They want a wall and a hearth and an end. So they burn the means of leaving \u2014 and it is presented as madness sent by a goddess, and it is also the single most rational thing anybody does in twelve books.</p><p>What turns: [[aeneas|Aeneas]] leaves them behind. The old, the tired, the women who have had enough \u2014 he founds a town in Sicily and settles them there, and the mission goes on with a smaller, harder crew. It is the correct decision, and it is a purge.</p>"
 },
 {
  "bk": 6,
  "half": "The Wandering",
  "k": "Book VI",
  "g": "the cave, the branch, the door",
  "h": "He goes down to ask his father a question",
  "s": "The rock at [[cumae|Cumae]] is hollowed into a chamber with a hundred tunnels and a hundred mouths, and when the god comes into [[sibyl|the Sibyl]] her face changes colour, her hair comes loose, she gets bigger, and the answers come roaring out of all hundred openings at once. She fights it. [[virgil|Virgil]] says the god is breaking her in the way you break a horse.\n\nShe tells him what is waiting in Italy \u2014 wars, horrible wars, and the Tiber foaming with blood \u2014 and then she tells him the way down.\n\nThe descent is easy, she says. The door of the dark king stands open, night and day. Coming back up: that is the work.\n\nTwo conditions. There is [[golden_bough|a branch of gold]] hidden in a dark wood, sacred to the queen of the dead, and nobody goes down without it \u2014 and if the fates want you, it will come away easily in your hand, and if they do not, no strength on earth will move it. And there is a body lying unburied on your beach, and you do not know whose, and it is polluting the whole fleet.\n\nHe walks down to the shore and finds [[misenus|the trumpeter]] face down in the surf.\n\nThey build the fire. And then two doves \u2014 his mother's birds \u2014 lead him into the wood, and there it is, glowing in the shade like mistletoe in winter.\n\nAnd he grabs at it, eagerly \u2014 and it holds back. The word is <em>cunctantem</em>. It hesitates.\n\nIt comes away. But it hesitates.",
  "stage": "<p>The descent to the dead is the oldest set-piece in epic and every serious poet has to do one. [[homer|Homer]]'s Odysseus digs a trench and lets the ghosts come to him. [[virgil|Virgil]] walks his man in.</p><p>What he builds is the thing the West kept. The lake with the smell coming off it that no bird will fly over. The ferryman who has not washed. The crowds on the bank \u2014 more than the leaves that fall at the first frost, more than the birds that come in over the sea when the cold turns them \u2014 all stretching out their hands for the far shore in love with the crossing. Thirteen centuries later Dante will get to the same river and find the same queue, because he read this.</p><p>And the cave is real. It is in the tufa above the Bay of Naples, a long trapezoidal gallery, opened by archaeologists in 1932, twenty minutes from where Virgil lived and is buried.</p>",
  "turns": "<p>One word turns here and it is <em>cunctantem</em>.</p><p>The rule was stated twice, and absolutely: if you are chosen it comes freely; if you are not, nothing will move it. There is no third option. And then the branch resists in his hand.</p><p>It cannot mean he is unchosen \u2014 he gets it, he goes down, he comes back. It cannot mean nothing \u2014 [[virgil|Virgil]] spent ten lines telling you precisely what a reluctant bough would signify. So it sits there: a small, deliberate, load-bearing wrongness planted in the machinery of the poem's most sacred moment.</p><p>Remember it. There is [[gates_of_sleep|another one]] at the other end of this book.</p>"
 },
 {
  "bk": 6,
  "h": "The queen who will not look at him",
  "half": "The Wandering",
  "k": "Book VI",
  "g": "the crossing, and the fields of mourning",
  "s": "[[palinurus|The helmsman]] is on the wrong bank, with the unburied, who are not allowed across for a hundred years. He comes up to [[aeneas|Aeneas]] and tells him what happened \u2014 and it is not the story we were told. No god took me, he says. I held the tiller for three days in the water, and swam to Italy, and hauled myself up a cliff with my own hands, and was murdered on the beach by strangers who thought I was worth robbing.\n\nNobody in the poem notices that this contradicts the narrator. Nobody reconciles it. It sits there.\n\nThen the ferryman, and the dog, and the country beyond.\n\nAnd there is a place called the Fields of Mourning, where those whom hard love wasted walk in a myrtle wood with their wounds still on them.\n\nAnd she is there. Still bleeding.\n\nHe is not sure at first \u2014 the way you are not sure of a face in fog, or of a new moon behind cloud. Then he cries, and speaks to her softly. Was it true? Was it the sword? Was I the cause? He swears by the stars and by the gods below that he went unwillingly. He says he did not think \u2014 did not believe \u2014 that his leaving could cause her grief as great as this.\n\nAnd [[dido|she does not look at him]]. He is talking; she is looking at the ground. Her face does not move any more than flint moves.\n\nThen she turns and goes back into the shadow of the wood, where [[sychaeus|her husband]] is waiting, who answers her love and gives it back to her equal.\n\nAnd Aeneas stands where she left him, shaken, crying, watching her go.",
  "stage": "<p>The silence is borrowed and [[virgil|Virgil]] wants you to know it. In [[homer|Homer]]'s underworld, Odysseus meets Ajax, who killed himself after being denied Achilles' armour \u2014 and Ajax will not speak to him, and walks away into the dark. It is the most famous silence in Greek literature.</p><p>Virgil takes it and gives it to a woman, and doubles it: she does not merely refuse to speak, she refuses to <em>look</em>, and she has somewhere better to go.</p><p>And the excuse he offers her \u2014 <em>I did not think my leaving would hurt you that much</em> \u2014 is so feeble that scholars have spent centuries trying to make it dignified. It is not dignified. It is what people actually say.</p>",
  "turns": "<p>This is the only argument in the poem that anyone wins against Rome, and it is won by saying nothing.</p><p>Every other opponent \u2014 [[turnus|Turnus]], [[mezentius|Mezentius]], [[camilla|Camilla]], [[juno|Juno]] \u2014 is beaten, or bought, or killed. [[dido|Dido]] simply declines to be in the scene. She turns her back on the founder of Rome and goes back to her husband, and there is nothing he can do about it, and the empire has no answer.</p><p>Watch what it costs him. He goes on down and gets the parade of heroes and the empire without end \u2014 and this is the last time we see him weep for anybody.</p>"
 },
 {
  "bk": 6,
  "h": "The parade of the unborn, and the ivory gate",
  "half": "The Wandering",
  "k": "Book VI",
  "g": "the empire, and the door out",
  "s": "At the far end of everything there is a green valley with light of its own, and its own sun and its own stars, and old men and boys wrestling and singing on the grass.\n\nAnd [[anchises|his father]] is at the end of it, counting.\n\nThese are the souls waiting to be born, and he has been going through them like a census. And he shows [[aeneas|his son]] the future: the Alban kings, and Romulus, and then \u2014 here, here is the man, so often promised to you \u2014 [[augustus|Augustus]] Caesar, son of a god, who will bring back the golden age.\n\nThen the long queue of names. And then a young man walking beside a famous general, beautiful, with his head down and a black night around his brow.\n\nWho is that? A son? A grandson? Look at the crowd around him.\n\nAnd Anchises starts crying and says: do not ask. Do not ask about your people's great grief. The fates will show him to the world and not let him stay. Give me lilies. Let me scatter purple flowers and heap them, at least, on the spirit of my descendant \u2014 an empty duty.\n\n[[marcellus|The boy]] is Augustus's heir, dead at nineteen. [[virgil|Virgil]] read this aloud with his mother in the room, and she fainted.\n\nThen the instruction, the one Rome quoted for two thousand years. Others will beat out bronze more softly. Others will plead cases better, and chart the stars. You, Roman \u2014 remember what you are for. Rule the peoples. Impose the habit of peace. Spare the conquered, and war down the proud.\n\nAnd then Anchises walks them to the gates.\n\nThere are two. One is of horn, and through it the true shades pass easily. The other is finished in gleaming white ivory, flawless \u2014 and through it the powers below send false dreams up into the world.\n\nHe sends his son out through the ivory one.\n\nAnd the poem changes the subject. Aeneas goes back to the ships. They sail up the coast. They anchor. Nobody ever mentions it again.",
  "stage": "<p>This is the most Augustan passage [[virgil|Virgil]] ever wrote and it is delivered by the least reliable narrator in the poem.</p><p>[[anchises|Anchises]] has been wrong before, expensively. He read the oracle as Crete and a colony died of plague. He is now standing in a meadow telling his son seven centuries of unbroken triumph, and there is not one word in it about [[dido|Dido]], or [[pallas|Pallas]], or [[turnus|Turnus]], or [[creusa|the wife]] lost in the smoke. The parade has no cost column.</p><p>And the instruction he hands over \u2014 <em>spare the conquered, war down the proud</em> \u2014 is magnificent, quotable, and completely useless at the only moment it is ever tested. In the last twelve lines of the poem, the man on the ground is conquered <em>and</em> proud, and [[aeneas|Aeneas]] has to choose, and his father's advice tells him nothing.</p>",
  "turns": "<p>The gate. There is no consensus, there has never been a consensus, and anyone who tells you it is settled is selling something.</p><p>The tidy answer: [[aeneas|Aeneas]] is alive, not a true shade, so the horn gate is not for him. That works \u2014 and it makes the ivory gate an empty flourish, which is a strange thing for [[virgil|Virgil]] to build and then leave hollow.</p><p>The unbearable answer: the vision is false. The parade of heroes, the golden age, the empire without end \u2014 all of it goes up into the world through the door of lies.</p><p>I do not think it can be settled, and I distrust the confidence of people who do. But note the architecture. Virgil did not have to put a door there. He built two, described exactly what each one is for, and then chose.</p><p>And remember [[golden_bough|the branch that hesitated]] at the start of this book. He has now bracketed the poem's most sacred chapter with two small, deliberate wrongnesses, and explained neither.</p>"
 },
 {
  "bk": 7,
  "half": "The War",
  "k": "Book VII",
  "g": "three visits, and a pet",
  "h": "A Fury, a stag, and a country at war with itself",
  "s": "They row up a river into farmland, and it is a shock after six books of storms and burning cities and the kingdom of the dead. Orchards. Cattle. Small towns. A country where nothing has happened for a hundred years.\n\nThey run out of plates and eat the flat bread they had been using as trenchers, and [[ascanius|the boy]] laughs and says: look, we're eating our tables. And everyone goes very quiet, because that was [[fatum|the prophecy]], and it was a joke, and they have arrived.\n\n[[latinus|The king]] is old, has one daughter, and has been told by an oracle not to marry her to a Latin \u2014 a foreigner is coming. So when the Trojans ask for a piece of land and a marriage, he says yes at once. He is delighted. He sends horses.\n\nIt could have ended there.\n\nThen [[juno|Juno]] says the sentence the whole second half hangs on: if I cannot bend heaven, I will move hell. And she goes down and gets [[allecto|a Fury]].\n\nThree visits. She goes to [[amata|the queen]] as a mother, pulls a snake out of her own hair, and slides it into her without a wound. She goes to [[turnus|Turnus]] at night as an old priestess, and he laughs at her and tells her to get back to her temple \u2014 so she stops pretending, and snakes come up in her hair, and she throws a torch into him, and it sticks, smoking, under his ribs.\n\nAnd then she does the small thing. She goes out to where a boy is hunting and puts a scent in front of his dogs.\n\nIt is a tame stag. A farm girl's pet, combed in the evenings, coming home to be fed. [[ascanius|Ascanius]] does not know. He sees a big animal.\n\nIt drags itself home to die, and the farmers come out of the fields with billhooks and fire-hardened stakes.\n\nAnd Italy converts itself, item by item, into an army: the ploughs abandoned, the pruning knives beaten into blades, the helmets pulled out of storage with the mould scraped off, the shields with the silver rotting on the leather.",
  "stage": "<p>[[virgil|Virgil]] wrote four books about farming before he wrote this one, and the list of a countryside arming itself is the work of a man who knows exactly what a pruning hook is worth.</p><p>The second half of the poem opens with a second invocation \u2014 a bigger order of things opens before me, he says, I begin a greater work. He is announcing that the <em>Odyssey</em> is finished and the <em>[[homer|Iliad]]</em> starts here. And then he immediately spends the book on a stag.</p><p>And [[allecto|Allecto]] is worth watching for what she does <em>not</em> do. She invents nothing. [[amata|Amata]] already wanted [[turnus|Turnus]] for her daughter. Turnus already thought he was being robbed. The farmers already had tools. She lights what was dry, and Virgil shows you the dryness first, every time.</p>",
  "turns": "<p>The war starts over a pet, and that is the most important artistic decision in the second half of the poem.</p><p>[[virgil|Virgil]] could have started it with an insult, a raid, a broken treaty \u2014 the whole armoury of casus belli was available. He chose a girl's tame deer, shot by a boy who did not know, at the prompting of a Fury nobody could see.</p><p>What turns: from here nothing is anybody's fault and everybody is guilty. [[latinus|Latinus]] is right and cannot act. [[turnus|Turnus]] is wronged and is wrong. [[ascanius|Ascanius]] \u2014 the ancestor of the Julian house, the child the whole mission is officially for \u2014 fires the shot that starts the war.</p><p>Virgil gave that arrow to the emperor's ancestor. He could have given it to anyone.</p>"
 },
 {
  "bk": 8,
  "half": "The War",
  "k": "Book VIII",
  "g": "a walk through Rome, before Rome",
  "h": "Cattle on the Capitol, and a shield with the future on it",
  "s": "[[aeneas|Aeneas]] goes up the Tiber looking for allies and finds a Greek exile called [[evander|Evander]], who is very old and who is king of a few huts and a herd of cattle on a hill above the river.\n\nThe place is called Pallanteum. It will be called the Palatine.\n\nAnd the old man walks him round it. Through a wood that will one day be an asylum. Past a cave that will be a shrine. Up a slope where the cattle are lowing in what will be the Roman Forum, and through a thicket on a hill that is <em>golden now</em>, [[virgil|Virgil]] says, and <em>once bristled with woodland scrub</em> \u2014 which is the Capitol, the most sacred ground in the world, and there is nothing on it but bushes.\n\nHe shows him the ruins of two towns that were there before his.\n\nThen he takes him home to a small house and gives him a bed of leaves and a bearskin, and says: dare to despise wealth, and make yourself worthy of a god.\n\nHe has no cavalry to spare, and one son, and he gives both. He asks [[aeneas|Aeneas]] to teach [[pallas|the boy]] war, and to bring him back.\n\nAnd he holds on to him at the gate and cannot let go, and faints, and is carried inside.",
  "stage": "<p>This is the greatest single act of imagination in the poem and it looks like a walking tour.</p><p>[[virgil|Virgil]]'s audience lived in a city of a million people. Marble, aqueducts, the largest metropolis on earth. And he walks them home to it and shows them cows.</p><p>Every stop is a landmark they passed on the way to the theatre \u2014 the Carmental Gate, the Lupercal, the Capitol, the Forum \u2014 and every one of them is a field or a cave or scrub. He shows you the imperial capital as a village and lets you feel seven hundred years drop through the floor.</p><p>And it is an argument. [[evander|Evander]] is poor and the poem says his poverty is the right way to live \u2014 which is exactly what [[augustus|Augustus]]'s regime claimed about itself, in marble. Virgil puts the claim in the mouth of a man in a hut, and does not comment.</p>",
  "turns": "<p>What turns here is a father handing over his only son, and the poem knows precisely what it is doing.</p><p>[[evander|Evander]] asks for one thing: teach him war, and bring him home. [[aeneas|Aeneas]] takes him on that trust. The next time these two are in the same scene, one of them is dead and the other is being carried indoors.</p><p>And the irony of the ground: [[pallas|Pallas]] dies for the alliance that gives Rome the hill it will be built on. The Palatine is bought with the boy who lives on it.</p>"
 },
 {
  "bk": 8,
  "half": "The War",
  "k": "Book VIII",
  "g": "the future, hammered into metal",
  "h": "The armour comes out of the volcano",
  "s": "[[venus|Venus]] goes to her husband at night and asks him for armour, and puts her white arms round him, and the poem is very dry about the rest.\n\nSo [[vulcan|the smith of the gods]] gets up in the middle of the night \u2014 [[virgil|Virgil]] compares him to a poor woman rising before dawn to card wool and keep her children fed, which is an extraordinary thing to say about a god \u2014 and goes down under the volcano and puts the Cyclopes to work.\n\nAnd what comes out is [[shield|a shield]] with the whole of Roman history hammered into it. History that has not happened yet.\n\nThe she-wolf, licking two boys. The Sabine women carried off at the games. Horatius on the bridge. The geese on the Capitol. Traitors thrown off the rock. Hannibal turned back.\n\nAnd in the middle of it the sea, and Actium. [[augustus|Augustus]] on the high stern with flames pouring out of his temples and his father's star over his head, and the senate and people of Rome behind him. And against him a Roman with an Egyptian wife, and the monstrous gods of the east \u2014 dog-headed Anubis raising weapons against [[venus|Venus]] and Neptune and Minerva. And Cleopatra pale with the death that is already coming for her, and the Nile opening its robes to take the beaten in.\n\nAnd then the last line of the book.\n\nHe marvels at it, not knowing the events \u2014 and he lifts onto his shoulder the fame and the fates of his descendants.",
  "stage": "<p><em>Ekphrasis</em> \u2014 the long description of a made object \u2014 is the most conspicuous move in epic, and everybody is measured against [[homer|Homer]]'s shield of Achilles, which shows the world as it is: a city at peace, a city at war, a harvest, a wedding, a dance.</p><p>[[virgil|Virgil]]'s shows the future, and it is entirely political, and it ends on an advertisement for the man paying for the poem.</p><p>And it stops the plot dead for a hundred lines, which is the point of the form: for as long as you are looking at the shield, the war has not started.</p>",
  "turns": "<p>The last line is the strangest thing [[virgil|Virgil]] ever did, and he did it at the end of his most propagandistic passage, on purpose.</p><p>You have just been shown seven centuries of Roman glory. And the man carrying it \u2014 the founder, the ancestor \u2014 cannot read one image on it. He is delighted by the pictures. He has no idea what they are.</p><p>Read it as pure triumph: the founder shouldering the destiny of Rome. Or read it exactly as written: a man picking up a weight he does not understand, because somebody handed it to him.</p><p>[[virgil|Virgil]] wrote the sentence so that both readings are the same sentence.</p>"
 },
 {
  "bk": 9,
  "half": "The War",
  "k": "Book IX",
  "g": "the night raid",
  "h": "Two friends go out and do not come back",
  "s": "[[aeneas|Aeneas]] is away up the river, and the camp is under attack, and two men volunteer to slip through the lines at night with a message.\n\nOne is older; the other is a beautiful boy with the first down on his cheeks. The poem says they are inseparable in the first line it gives them.\n\nAnd on the way they find the Latin camp drunk and asleep \u2014 and take the opportunity, and go along the rows in the dark killing sleeping men. It is not glorious. [[virgil|Virgil]] writes it as a slaughterhouse. And [[nisus_euryalus|Euryalus]], who is young and cannot help himself, takes a belt of gold studs and a fine helmet as he goes.\n\nThey get clear of the camp. And then a patrol comes down the road, and the moon comes out, and the helmet answers it.\n\nNisus is already in the trees. He is safe.\n\nHe looks back and cannot see his friend. So he goes back \u2014 back through the woods, to the edge of the ring of men \u2014 and throws from the dark, and kills two of them, and cannot save him.\n\nAnd then he comes out shouting that he did it, all of it, that the boy did nothing, look at me \u2014 in time to watch the sword go into Euryalus's white chest.\n\nHe goes into them and dies on his friend's body.\n\nAnd [[virgil|Virgil]] steps out of his own poem, the only time in twelve books, and says: fortunate pair. If my poetry has any power at all, no day will ever take you out of the memory of time.",
  "stage": "<p>The model is the <em>Iliad</em>: Odysseus and Diomedes go out at night, kill sleeping men, steal some horses, come back heroes. [[virgil|Virgil]] takes the same raid and lets it fail, and lets the killing be squalid, and lets the boy die for a helmet.</p><p>The <em>apostrophe</em> \u2014 the poet turning aside from the story to address his own characters directly \u2014 is a permitted epic move, and Virgil almost never uses it. Not for [[dido|Dido]]. Not for [[pallas|Pallas]]. Not for the founder of Rome.</p><p>He uses it here.</p>",
  "turns": "<p>This is the ledger's most awkward entry, and it is the reason to take the ledger seriously.</p><p>The raid achieves nothing. The message is never delivered. The men they kill are drunk and asleep. [[nisus_euryalus|Euryalus]] dies because he stole a helmet; Nisus dies because he went back for someone already lost. The heads are stuck on spears and shown to the boy's mother, who has to be carried off the wall screaming.</p><p>It buys nothing at all. And it is the only place in twelve books where the poet promises somebody immortality in his own voice.</p><p>Which suggests, uncomfortably, that [[virgil|Virgil]] knew exactly what his poem was doing \u2014 and spent his single intervention on a death that could not be justified by any of it.</p>"
 },
 {
  "bk": 9,
  "half": "The War",
  "k": "Book IX",
  "g": "one man inside the walls",
  "h": "Turnus gets in, and cannot get out",
  "s": "He gets over the wall. The gate is opened by two brothers who want a fight, and [[turnus|Turnus]] comes through it, and then the gate shuts behind him.\n\nHe is alone inside an enemy camp with an army outside it.\n\nAnd for two hundred lines he is unstoppable. He goes through them like a lion in a stockyard. He kills a man in the middle of a sentence. The Trojans crowd round him and cannot bring him down, and the poem starts comparing him to weather.\n\nAnd then, slowly, the numbers begin to tell. The whole army closes on him. His shield is being hammered flat. His helmet rings. The stones come off the wall. The bronze on his head splits, and the crest is torn away, and the sweat is running black in the dust on his face.\n\nAnd he backs, step by step, to the river.\n\nAnd he goes in in full armour \u2014 in his armour, into the Tiber \u2014 and the yellow water takes him and holds him up and carries him, and washes the blood off him, and gives him back to his own men, glad.",
  "stage": "<p>[[virgil|Virgil]] gives his antagonist the best action sequence in the poem, and it comes right after he has given the Trojans two boys dying pointlessly in the dark. That order is deliberate.</p><p>Watch the similes bend. He is a lion, then a wolf at a sheepfold, then a boulder, then a fire in standing corn \u2014 the imagery of [[furor|furor]], of the thing that cannot be reasoned with. And then, at the river, it stops, and the language goes clean and physical and human: sweat, dust, split bronze, a man tired out.</p><p>[[juno|Juno]] gets him out. She is allowed to save him here, and she will not be allowed to save him at the end, and this is the last time she can.</p>",
  "turns": "<p>What turns here is your sympathy, and [[virgil|Virgil]] engineered it.</p><p>[[turnus|Turnus]] is the villain. He killed nobody who matters yet \u2014 [[pallas|that comes next book]] \u2014 and the poem has just spent an entire chapter making the Trojans the injured party. And then it puts him alone inside a wall with an army on him, and makes him magnificent, and lets him swim home.</p><p>The <em>[[homer|Iliad]]</em> shape is now unmistakable. A man defending his own country, deserted by heaven, alone against foreigners, going down slowly under numbers.</p><p>That is not Achilles. That is Hector \u2014 and Virgil has given the role to the man Rome has to kill.</p>"
 },
 {
  "bk": 10,
  "half": "The War",
  "k": "Book X",
  "g": "the boy, and the belt",
  "h": "Turnus kills the boy and puts on his belt",
  "s": "[[turnus|Turnus]] comes looking for him specifically.\n\nHe clears the field to get at [[pallas|Pallas]] \u2014 [[evander|an old man's]] only son, on his first day of war, on loan with a father's request attached \u2014 and tells the others to stand back. He says he wishes the father were here to watch.\n\nThe boy throws first, and it does nothing. Turnus throws once.\n\nThen he puts his foot on the body to work the spear out, and takes [[baldric|the sword-belt]] off him \u2014 wide, gold-worked, heavy, engraved with a picture of fifty bridegrooms murdered on their wedding night \u2014 and puts it on. Take him back to his father, he says. As he is.\n\nAnd [[virgil|Virgil]] stops the battle to speak, which he almost never does. The mind of man knows nothing of fate, he says, or of what is coming, or how to keep its balance when things are going well. There will be a time when Turnus would pay anything not to have touched this boy, and will hate this belt, and this day.\n\nAnd [[aeneas|Aeneas]] hears, and goes through the field like a fire.\n\nHe takes eight men alive to be slaughtered at the funeral, and the poem reports this flatly and does not defend it. He refuses a man begging for his life, and taunts him while he kills him. He kills a priest. He kills a pair of brothers.\n\nThis is the man the poem has been calling <em>[[pietas|pius]]</em> for nine books, and [[virgil|Virgil]] does not withdraw the word and does not excuse the behaviour, and lets you sit with both.",
  "stage": "<p>The <em>aristeia</em> \u2014 the passage in which a hero goes through the enemy at his terrible best \u2014 is standard epic furniture, and it is normally where you are supposed to admire him.</p><p>[[virgil|Virgil]] gives [[aeneas|Aeneas]] his aristeia and makes it appalling. The human sacrifice is lifted straight from Achilles, who slaughters twelve Trojan youths at Patroclus's pyre \u2014 the most savage thing in the <em>[[homer|Iliad]]</em>, and the thing Homer's own characters find hard to look at.</p><p>Virgil chose to import it. Nothing in the plot required it. He put the ugliest act in Greek epic into the hands of the founder of Rome, and left it there without comment.</p>",
  "turns": "<p>The belt is what turns, and it will not stop turning for two more books.</p><p>Look at the engraving. A slaughter at a wedding \u2014 worn into a war that is being fought over a marriage, by a man who is going to lose the bride. [[virgil|Virgil]] does not point at this once. He puts it on the object and lets it sit there until it kills him.</p><p>And watch what happens to [[aeneas|Aeneas]] immediately: he takes prisoners for sacrifice. The poem is showing you, in real time, that grief for [[pallas|Pallas]] makes him capable of anything. Remember that when he is standing over a beaten man in the last twelve lines and appears to be about to show mercy.</p>"
 },
 {
  "bk": 10,
  "half": "The War",
  "k": "Book X",
  "g": "a father, a son, and a horse",
  "h": "Mezentius asks his horse for one more ride",
  "s": "[[mezentius|Mezentius]] is a tyrant so cruel that his own city threw him out. He used to tie living men to corpses, face to face, hand to hand, and leave them to die slowly of the embrace. He calls his right hand and his spear the only gods he has ever needed.\n\n[[aeneas|Aeneas]] puts a spear into his groin and he is dragged out of the fight by his men.\n\nAnd [[lausus|his son]] steps into the gap.\n\nHe holds Aeneas off long enough for the old man to get clear. Aeneas shouts at him to stand back \u2014 tells him he is being reckless, that his devotion is running out ahead of his strength. The boy does not move.\n\nSo Aeneas kills him, and the sword goes through a tunic his mother had embroidered with soft gold thread.\n\nAnd then he looks at the face, and at the terrible pallor coming over it, and he groans, and holds out his hand \u2014 and the poem says the image of his own father came into his mind.\n\nThey bring the body to where the old man is washing his wound at the river.\n\nWas I so in love with living, he says, that I let my son stand in for me? Is this what my crimes bought you \u2014 to be killed for me? I am the only stain on your name. I have been thrown out of every place I ever had, hated everywhere, and I have stayed alive too long.\n\nThen he calls for his horse, who has carried him for years, and talks to it like a friend. We will bring back the head of the man who did this, he says, or we will go down together \u2014 because you are too proud to take a Trojan master.\n\nAnd he rides at [[aeneas|Aeneas]] three times, and is killed, and asks only to be buried where his own people cannot get at his body.",
  "stage": "<p>[[virgil|Virgil]] establishes the atrocity first \u2014 the living tied to the dead, one sentence, enough \u2014 so that you cannot possibly be on his side. And then he kills the man's son in front of him and gives him a father's grief so exact that you have nowhere to put your sympathy.</p><p>He is the <em>contemptor divum</em>, the despiser of gods, which in Roman terms is the worst thing a person can be. And he dies of [[pietas|pietas]] \u2014 of a son's devotion he did not deserve and never asked for.</p><p>The horse is the last touch, and it is the one that finishes you. He is going out to die, and the last conversation he has is with an animal, about who deserves to own it.</p>",
  "turns": "<p>The poem's central virtue changes hands here, and it lands in the wrong place.</p><p>The monster's son has [[pietas|pietas]], and it kills him. And the man who <em>is</em> pietas \u2014 [[aeneas|Aeneas]], who has carried the word like a title for ten books \u2014 is the one who put the sword into him, in the same afternoon in which he took eight men alive to be slaughtered at a funeral.</p><p>Watch what Aeneas says over the body: <em>keep the armour, and take this comfort \u2014 you fell to the hand of great Aeneas</em>. It is meant as kindness. It is the most self-regarding sentence in the poem. Both of those are true at once, and [[virgil|Virgil]] does not help you.</p>"
 },
 {
  "bk": 11,
  "half": "The War",
  "k": "Book XI",
  "g": "a body comes home, and a council fails",
  "h": "They bury the dead and argue about whose fault it is",
  "s": "They send [[pallas|the boy]] home on a bier of oak and arbutus branches, with two robes [[dido|Dido]] made in [[carthage|Carthage]] with her own hands \u2014 [[aeneas|Aeneas]] wraps him in one of them \u2014 and a thousand men walking behind.\n\n[[evander|His father]] comes out of the gate and throws himself onto the body, and cannot be pulled off it, and when he can speak at last he does not blame anyone.\n\nI do not blame the Trojans, he says, or the alliance, or the hands we shook. This debt was owed to my old age.\n\nAnd then, quietly, the thing he will not take back: tell [[aeneas|Aeneas]] that there is one reason he owes me his life. [[turnus|Turnus]].\n\nThen a truce, and twelve days of burning the dead \u2014 and the poem stays out on the field and watches the smoke, and the mothers on the walls of the Latin city saying out loud that one man's marriage is the reason all of this is happening.\n\nAnd in the council chamber [[latinus|Latinus]] proposes peace, and is right, and is ignored; a politician called Drances says out loud what everybody is thinking, which is that Turnus should fight his own duel; and Turnus loses his temper and answers him magnificently and settles nothing.\n\nAnd while they are still arguing, the Trojan army is reported at the gates.",
  "stage": "<p>Book XI is the poem's quietest and its most political, and it is the one that most resembles Rome.</p><p>The council scene is a Roman senate meeting in fancy dress \u2014 a weak head of state proposing terms, a gifted speaker with no army sniping at a general, a general with an army who cannot be controlled by either of them. [[virgil|Virgil]]'s audience had watched exactly this fail, repeatedly, for a hundred years, ending in Actium.</p><p>And notice the two robes. [[dido|Dido]] made them, with her own hands, for a man she loved. Nine books later one of them is a shroud for a dead child. The <em>[[baldric|Aeneid]]</em> is a poem about objects that come back wrong, and this is the gentlest and the worst of them.</p>",
  "turns": "<p>What turns here is that everybody now knows what the war is for, and nobody can stop it.</p><p>The mothers on the wall say it plainly: this is about one man's wedding. [[latinus|The king]] says it in council. Drances says it. Even [[turnus|Turnus]] offers, in the middle of his fury, to fight the duel alone and settle it \u2014 and the offer is real, and it is not taken up, and the killing goes on for another book.</p><p>[[evander|Evander]]'s line is the one to carry forward: <em>Turnus</em>. The father does not curse the alliance or the gods. He names a man, and hands the sentence to [[aeneas|Aeneas]], and Aeneas will carry it out in the last four lines of the poem.</p>"
 },
 {
  "bk": 11,
  "half": "The War",
  "k": "Book XI",
  "g": "the cavalry, and the gold",
  "h": "Camilla, and the breastplate she should not have wanted",
  "s": "Her father was a tyrant, chased out of his own city with a baby in his arms, and when he came to a flooded river with a mob behind him he tied her to his spear, promised her to the goddess of the hunt, and threw her across.\n\nShe grew up in the woods on mare's milk. She never learned to spin. She could run over a field of standing wheat, [[virgil|Virgil]] says, without bending the ears of corn, and over the open sea without wetting her feet. Mothers wanted her for their sons, and she wanted nothing but her spear.\n\nShe leads the Latin cavalry, and for most of a book nothing on the field can touch her.\n\nThen she sees a Trojan priest called Chloreus, dressed the way a man dresses when he has never had to fight \u2014 saffron and purple, a gilded bow, bronze scales worked with gold. And she wants it.\n\nShe goes after him across the whole field, blind to everything else.\n\nArruns has been circling her for an hour, waiting, praying. He throws while she is looking at the gold.\n\nIt goes in under the exposed breast. She reaches for the shaft and cannot get it out. Her friends catch her as she goes down. She starts to give an order about the battle, and does not finish it \u2014 and lets go of the reins.\n\nAnd her life fled, resentful, with a groan, into the shades.",
  "stage": "<p>She is [[virgil|Virgil]]'s invention. There is no Camilla before him \u2014 he made her, gave her a whole childhood, and killed her in a book most people never reach.</p><p>And he kills her with a line of commentary that is the only genuinely cheap sentence in the poem: she was hunting the gold, he says, <em>with a woman's love of spoil and finery</em>.</p><p>You can defend it \u2014 the appetite for spoil is exactly what kills [[turnus|Turnus]] too, and the parallel is the point. But Virgil says it out loud about her and stays silent about him, and that asymmetry is his.</p>",
  "turns": "<p>Listen to the last line and then hold on to it.</p><p><em>Her life fled, resentful, with a groan, into the shades.</em> That is, word for word, the last line of the <em>Aeneid</em>. It will belong to [[turnus|Turnus]].</p><p>[[virgil|Virgil]] wrote it here first \u2014 quietly, in the middle of a cavalry skirmish, for a woman most readers have forgotten by the end \u2014 so that when it comes back four hundred lines later, on the founder of Rome's sword, you will already know exactly what it means and where you have heard it.</p><p>That is the single most controlled thing in the poem, and it is the strongest evidence that the ending is not an accident.</p>"

  "bk": 12,

  "g": "the truce, and the breaking of it",
  "h": "A peace is agreed, and broken by nobody",
  "s": "They agree to settle it with a duel. Two men, one field, and everybody goes home.\n\nThe altars are built. The oaths are sworn \u2014 [[aeneas|Aeneas]] swears that if he loses, the Trojans will leave Italy for good, and that if he wins he will not take the kingdom or rule it, but will build a city and share it, and the Latins will keep their gods and their laws. [[latinus|Latinus]] swears with him.\n\nIt is, on the page, a decent peace.\n\nAnd then Turnus's sister \u2014 a nymph, who has been given immortality by the god who wanted her, and would very much like to give it back \u2014 goes down the ranks in disguise and works on the young men. Look at him, she says. Look at how alone he is. Are we really going to hand our country to one man's fight?\n\nSomebody throws a spear. The truce comes apart in about four lines. The altars are knocked over and men are grabbing weapons off the ground and [[aeneas|Aeneas]], bare-headed, unarmed, with his hand up, is shouting at his own men to stop \u2014 the treaty is made, the terms are set, this is my fight \u2014 and an arrow comes out of the crowd and hits him.\n\nNobody ever finds out who shot it.",
  "stage": "<p>[[virgil|Virgil]] gives [[aeneas|Aeneas]] the best moment of his life here and almost nobody notices it, because it is over in eight lines: a man standing bare-headed in the middle of a collapsing truce with his hand in the air, shouting for peace, while the arrows go past him.</p><p>It is the only time in twelve books he is unambiguously admirable, and it is immediately punished.</p><p>The broken oath is deep Roman material. Treaties, formulae, the correct words in the correct order \u2014 Roman religion was a legal system, and a broken oath was not a lapse of honour but a defect of title. The war that follows is, in Roman terms, void.</p>",

  "s": "[[jupiter|Jupiter]] finally tells her to stop. It is over. She has lost, and he says so kindly, and asks her to give it up.\n\nAnd she does.\n\nAnd then she asks for one thing \u2014 a favour, she says, forbidden by no law of fate.\n\nWhen they marry, and they will: let the Latins keep their own name. Do not make them Trojans. Do not make them change their language, or their dress. Let Latium go on being Latium. Let the Alban kings be Alban. Let Rome, when it comes, be great with <em>Italian</em> strength.\n\n[[troy|Troy]] has fallen. Let Troy stay fallen \u2014 name and all.\n\nAnd [[jupiter|Jupiter]] smiles, and gives her everything she asks for. The people, he says, will be Latin. They will keep the speech and the customs of their fathers. The Trojans will sink into the mass, and you will see a race arise, mixed with Italian blood, that will surpass men and gods in devotion.\n\nAnd [[juno|Juno]] goes up out of the sky, and takes her mind off the war, and is not seen again.",
  "stage": "<p>This is the treaty scene, and it is written in the language of a Roman legal settlement \u2014 [[juno|Juno]] does not surrender, she <em>negotiates terms</em>, and the terms are specific, itemised, and granted in full.</p><p>It is also the answer to a question the audience had been carrying for eleven books: why do we speak Latin? Rome's founding myth says its founder was a Trojan refugee. Rome's language is Italian, its gods are Italian, its name is Italian. [[virgil|Virgil]] has to explain the gap, and this is his explanation, and it is put in the mouth of the poem's antagonist.</p>",

  "h": "He is stopping. And then he sees the belt.",
  "s": "His sister has been on the field in disguise, driving his chariot, keeping him away from [[aeneas|Aeneas]]. He sees through her and tells her to stop.\n\nIs dying really so terrible? he says. And then: this madness, now, is enough.\n\nSo he walks out to a duel he expects to lose, and asks only that they stop the fighting behind him.\n\nHis sword breaks in his hand \u2014 he had grabbed the wrong one on the way out of the house. He runs, and is hunted round the field in front of both armies, and the spear goes through his thigh, and he goes down on one knee.\n\nAnd he does not beg for his life.\n\nI have earned this, he says. I am not asking for mercy. Take what you have won. But if a wretched father's grief can reach you at all \u2014 and you had a father like mine \u2014 have pity on old Daunus. Send me back to my people. Or my body, if you prefer. You have won. [[lavinia|The girl]] is yours. Do not push your hatred any further.\n\nAnd [[aeneas|Aeneas]] stops.\n\nHe is standing over him with the sword up, and his eyes are moving, and the words are beginning to work on him, and he is starting to turn.\n\nHe is going to let him live.\n\nAnd then the man on the ground shifts his shoulder, and the light catches a strip of gold studs, and Aeneas sees [[baldric|the belt]]. [[pallas|The boy's]] belt. On this man's shoulder. Worn like a coat.\n\nYou, dressed in the spoils of my own \u2014 and you expect to be taken out of my hands?\n\nHe goes in blazing. He puts the sword in the chest, up to the hilt.\n\nThe limbs go slack with the cold.\n\nAnd the life fled, resentful, with a groan, into the shades.\n\nThere is no more poem after that.",
  "stage": "<p>[[homer|Homer]] does not end here. The <em>Iliad</em> kills Hector in Book XXII and then spends two more books burying him \u2014 Priam crossing the lines at night to kneel and kiss the hands of the man who killed his son, and Achilles giving the body back, and the two of them weeping together, and a funeral.</p><p>[[virgil|Virgil]] knew that ending. Every person in his audience knew it. And he stops one line after the kill.</p><p>[[turnus|Turnus]] asks for exactly that \u2014 <em>send me back to my people, or my body</em> \u2014 and does not get it, and the poem does not stay to see whether anyone comes for him. The greatest scene of reconciliation in ancient literature is offered, in the text, by the dying man, and refused, and then the book closes.</p>",
  "turns": "<p>Everything turns here, and what it turns on is a hesitation.</p><p>[[virgil|Virgil]] did not have to write it. He could have had [[aeneas|Aeneas]] kill him cleanly, in judgement, without a wobble. Instead he shows you the mercy starting \u2014 the eyes moving, the words landing, the sword not coming down \u2014 and then takes it away with an object.</p><p>And the word he uses in the last moment is <em>furiis accensus</em>: kindled by the Furies. It is the same fire the poem has spent twelve books identifying as the enemy of everything Rome claims to be. [[juno|Juno]]'s fire. [[dido|Dido]]'s. [[allecto|The one the Fury]] threw into Turnus with a torch. It has been chased across a continent and out of heaven and finally shut in a room \u2014 and in the last four lines it is standing in the founder of Rome, holding a sword.</p><p>The Augustan reading says this is justice: [[pallas|the boy]] was under his protection, Roman law and Roman feeling permitted it, and [[anchises|his father]] told him to war down the proud. It is not a stupid reading, and for eighteen centuries it was the standard one.</p><p>The other reading says: he was already stopping.</p><p>I lean to the second, and I have told you so throughout, so you can weigh it. But note what nobody disputes. The <em>Aeneid</em> does not end on a founding, or a wedding, or a triumph. It ends on a killing that the hero had decided not to do, and on a groan, and on the word <em>shades</em> \u2014 and then a poet who wanted the whole thing burned ran out of time."
