  "beyond": "<p>This is the single most extraordinary act of imagination in the poem, and it is easy to miss because it looks like a walking tour.</p><p>[[virgil|Virgil]]'s audience lived in a city of a million people, marble everywhere, the greatest metropolis on earth. And he takes them home to it and shows them cows.</p><p>Every location on the walk is a landmark his readers passed daily \u2014 the Carmental Gate, the Lupercal, the Capitol, the Forum \u2014 and every one of them is a field, a cave, a thicket. Cattle low in the Forum. The Capitol is <em>golden now, once bristling with woodland scrub</em>. He shows you the imperial capital as a village and then lets you feel the seven hundred years drop.</p><p>It is also, quietly, an argument. Evander's house is poor, and the poem says his poverty is the right way to live. That is precisely what [[augustus|Augustus]]'s regime claimed about itself \u2014 old virtue, simple living, the ancestral way \u2014 while building in marble. Virgil lets the old man say it in a hut, and does not comment.</p>",

    "h": "On Loan",
    "body": "He is a boy. He has never been in a battle. [[evander|His father]] sends him out with a cavalry troop and one request to [[aeneas|Aeneas]]: teach him war, and bring him home.\n\nAnd he is good. He rallies a broken line by shouting at it, and he fights well, and the poem likes him.\n\nThen [[turnus|Turnus]] comes looking for him specifically, and clears the field to get him, and tells the others to stand back \u2014 and says he wishes the father were here to watch.\n\nPallas throws first and it does nothing. Turnus throws once.\n\nThen he puts his foot on the body to work the spear out, and takes [[baldric|the sword-belt]] off him, and puts it on, and tells them to send the boy back to his father as he is.\n\nHis father gets the body. He does not accuse anyone. He says only: I do not blame the Trojans, or the alliance, or the hands we shook. This debt was owed to my old age. And then he says the thing he will not take back \u2014 tell [[aeneas|Aeneas]] this is the one reason he owes me his life: [[turnus|Turnus]]."

  "beneath": "<p>He is dead by the middle of Book X and he is the most important person in the last third of the poem.</p><p>His death does three things. It puts a debt on [[aeneas|Aeneas]] that he cannot discharge \u2014 he took the boy on a father's trust and lost him. It hands the poem the object it will end on. And it changes Aeneas: immediately after Pallas dies, Aeneas goes through the field taking prisoners for human sacrifice at the funeral, which the poem reports flatly and does not defend.</p><p>And it is the reason [[turnus|Turnus]] dies begging. Everything in the last four lines runs back to a boy on his first day, and a man who could not resist putting on his belt.</p><p>The [[baldric|belt]] is engraved, incidentally, with a massacre: fifty bridegrooms murdered on their wedding night. Turnus wears a picture of a slaughter at a marriage, into a war being fought over a marriage, and is killed for it. [[virgil|Virgil]] does not point at this. He just puts it there.</p>",

  "sections": [

    "h": "The Night Raid",
    "body": "They are inseparable, and the poem says so in the first line it gives them. One is older; one is a beautiful boy with the first down on his cheeks.\n\nThey volunteer to slip through the enemy lines at night with a message. And on the way they find the Latin camp drunk and asleep, and take the opportunity, and go along the rows in the dark killing sleeping men \u2014 and [[nisus_euryalus|Euryalus]], who is young and cannot help himself, takes a belt of gold studs and a beautiful helmet as he goes.\n\nThey get clear of the camp. And then a patrol comes down the road, and the moon comes out, and the helmet answers it.\n\nNisus is already in the trees. He is safe. He looks back and cannot see his friend.\n\nSo he goes back \u2014 back through the woods, to the edge of the ring of men, and throws from the dark, and kills two of them, and cannot save him. And he comes out shouting that he did it, all of it, that the boy did nothing, that they should look at him \u2014 in time to watch the sword go into Euryalus's white chest.\n\nThen he goes into them and dies on his friend's body.\n\nAnd [[virgil|Virgil]] steps out of his own poem, the only time in twelve books, to say: fortunate pair. If my poetry has any power at all, no day will ever take you out of the memory of time."

  "beneath": "<p>The apostrophe is the tell. In twelve books, [[virgil|Virgil]] never once speaks in his own voice about anyone \u2014 not [[dido|Dido]], not [[pallas|Pallas]], not [[turnus|Turnus]], not the founder of Rome. He does it here, for two soldiers who achieved nothing.</p><p>And that is the point of them. The raid is a total failure. They do not deliver the message. The men they kill are asleep and drunk and the killing is not glorious \u2014 it is a slaughterhouse, and [[virgil|Virgil]] writes it that way. Euryalus dies because he stole a helmet. Nisus dies because he went back for someone who was already lost.</p><p>The whole episode buys nothing at all. And it is the only place in the poem where the poet promises someone immortality.</p><p>Which is the ledger's most awkward entry, because it suggests [[virgil|Virgil]] knew precisely what his poem was doing, and reserved his one intervention for a death that could not be justified by any of it.</p>",

  "sections": [

    "h": "The Cave with a Hundred Mouths",
    "body": "The rock at Cumae is hollowed into a vast chamber, and there are a hundred wide tunnels leading into it, and a hundred mouths, and when the god comes the answers come roaring out of all of them at once.\n\nShe is an old woman, and when he takes her, her face changes colour and her hair comes loose and her chest heaves and she gets bigger, and her voice stops sounding human. She fights it. The poem is explicit: the god is breaking her in, the way you break a horse.\n\nShe tells [[aeneas|Aeneas]] what is waiting in Italy \u2014 wars, horrible wars, and the Tiber foaming with blood \u2014 and then tells him the way down.\n\nThe descent is easy, she says. The door of the dark king stands open night and day. Coming back up \u2014 that is the work.\n\nAnd there are conditions. Find [[golden_bough|the golden bough]]. Bury the friend who is lying dead on the beach and does not know it yet.\n\nThen she walks him down."

  "beyond": "<p>She was not fiction to the audience. The cave is at Cumae on the Bay of Naples, an hour from where [[virgil|Virgil]] lived and is buried, and you can walk into it today \u2014 a long trapezoidal tunnel cut through the tufa, exactly as described, opened by archaeologists in 1932.</p><p>And the Sibyl was an institution of the Roman state. The Sibylline Books \u2014 a collection of oracles said to have been sold to a Roman king by this very woman \u2014 were kept in the temple of Jupiter on the Capitol, guarded by a college of priests, and consulted by senatorial decree at moments of national emergency: plagues, defeats, monstrous births. They were state papers.</p><p>[[augustus|Augustus]] moved them into the temple of Apollo on the Palatine, next to his own house, after having a great many of them burned as forgeries.</p><p>So the prophetess in the cave is not a fairy tale. She is the source of the documents that governed Roman religion, and the emperor had recently taken personal custody of her archive and edited it.</p>",

    "body": "[[venus|Venus]] comes to him in Book I with tears in her eyes, complaining about the storm, and he smiles \u2014 the smile with which he clears the sky \u2014 and kisses his daughter and tells her to stop worrying.\n\nAnd then he unrolls the future. Aeneas will fight a war and win it. His son will move the capital. Three hundred years of Alban kings. A she-wolf. Romulus. And then a people to whom he sets no boundary in space or time: <em>imperium sine fine dedi</em> \u2014 I have given them empire without end.\n\nEven [[juno|Juno]], he says, will come round in the end and learn to love the Romans.\n\nHe is the only figure in the poem who says clearly what all of it is for. He says it once, in the first book, before a single person has died \u2014 and then he spends the remaining eleven books doing almost nothing, refereeing his wife and his daughter, holding up his golden scales, and letting it happen."

  "beneath": "<p>Two words in that promise have done more damage than anything else in Latin literature: <em>sine fine</em>, without end. Not without limit in space \u2014 without limit at all. No boundary, no term, no expiry.</p><p>It is the most extravagant thing any god says in the poem, and it is said to soothe an anxious mother, in the first book, as a piece of reassurance.</p><p>And then look at what he actually does. He does not stop the storm ([[neptune|Neptune]] does). He does not stop [[dido|Dido]] dying. He lets [[juno|Juno]] run a war for four books and only intervenes when it is already over \u2014 and then he settles it by giving her everything she asks for. His last significant act in the poem is to hand the Trojan name to the fire in exchange for peace at home.</p><p>He is fate's civil servant, not its author. When [[aeneas|Aeneas]] and [[turnus|Turnus]] fight, he does not choose. He holds up scales and lets them decide.</p>",

    "body": "[[juno|Juno]] cannot bend heaven, so she goes down and gets her.\n\nShe is a Fury, and the poem says her own father and her own sisters hate her, because of the shapes she can take and the snakes that come out of her. War, treachery, accusation and grief are what she is for.\n\nAnd Juno gives her a country at peace and three instructions.\n\nFirst she goes to [[amata|the queen]] as a mother, and pulls a snake out of her hair and puts it into her, and it slides over her body without a wound and goes in, and turns her into something the poem compares to a top under a whip.\n\nThen she goes to [[turnus|Turnus]] at night as an old priestess and tells him, reasonably, that he is being robbed. He laughs at her and tells her to go back to her temple. So she stops pretending \u2014 snakes come up in her hair, her eyes go still, and she throws a torch into him and it sticks, smoking, under his ribs.\n\nAnd then she does the small thing. She goes out to where a boy is hunting, and puts the scent of a tame stag in front of his dogs.\n\nThat is all. Three visits, and a country that has been quiet for a hundred years is at war with itself by the end of the book."

  "beneath": "<p>She is the most efficient character in the poem, and what she reveals is that none of the material was hers.</p><p>[[amata|Amata]] already wanted [[turnus|Turnus]] for her daughter. Turnus already thought he was being robbed. The farmers already had billhooks. Allecto does not manufacture anything \u2014 she lights what was dry, and [[virgil|Virgil]] is scrupulous about showing you the dryness first.</p><p>Which raises the question the poem lives on. If a Fury only ever ignites what was already there, is she a supernatural agent or a name for something? Every act of [[furor|furor]] in the <em>Aeneid</em> \u2014 [[dido|Dido]]'s, [[turnus|Turnus]]'s, Amata's, and the last four lines of the poem \u2014 is presented as arriving from outside a person, and every one of them is also, on inspection, native to them.</p><p>[[juno|Juno]] summons her, and Juno is the poem's own personification of rage that knows it is futile and goes on. Allecto is Juno's psychology with a body.</p>",

    "h": "Already Ash",
    "body": "When the poem opens, it is gone. That is the first thing to understand about it: the <em>Aeneid</em> is not a poem about Troy. It is a poem about people carrying one.\n\nIt was a real city, ten years under siege, ended in a night. [[aeneas|Aeneas]] tells the whole story himself, in the first person, at a dinner table in [[carthage|Carthage]] \u2014 the [[horse|horse]], [[sinon|the liar]], [[laocoon|the serpents]], [[priam|the king at the altar]], [[creusa|the wife lost in the smoke]].\n\nAnd he tells you the thing that is easy to miss. When his mother takes the mist off his eyes, what he sees is not Greeks. It is [[neptune|Neptune]] levering the walls apart from below, [[juno|Juno]] at the gate with a sword, and [[jupiter|Jupiter]] handing out the strength. The city was not lost. It was demolished, from above.\n\nAnd at the end, in Book XII, [[juno|Juno]] asks for one last thing and gets it: that Troy shall be gone for good \u2014 name, language, dress, all of it \u2014 and shall never come back.\n\nSo the city burns twice. Once in the fire, and once in the peace treaty."

  "beyond": "<p>Being Trojan was embarrassing, and Rome had to work at it.</p><p>Trojans lost. That is the entire content of the Trojan story to a Greek. And the Romans, who spent centuries being condescended to by Greek intellectuals, had picked as their founding myth a defeated people running away from a burning town.</p><p>There was worse. A persistent old tradition \u2014 well known, and hostile \u2014 held that [[aeneas|Aeneas]] survived the sack because he betrayed the city to the Greeks and was let out through the gate as a reward.</p><p>[[virgil|Virgil]] answers this in the only way available: he hands Aeneas the microphone for an entire book and makes him tell it himself, in the first person, fighting until the gods physically restrain him. Book II is a defence brief. It works so completely that almost nobody now knows there was a charge.</p>",

    "body": "[[aeneas|Aeneas]] walks into it wrapped in a cloud and what he sees is a building site with a queen in it.\n\nMen are hauling stone up the slope. Some are laying out walls and rolling blocks by hand; some are digging a harbour; some are cutting the foundations of a theatre out of the rock and shaping columns for a stage that does not exist yet. [[dido|Dido]] is walking through it giving out laws and drawing lots for the work.\n\nIt is like a hive in early summer, [[virgil|Virgil]] says \u2014 the whole colony out, the honey smell over everything, some bringing it in, some packing it, some driving the drones off.\n\nAnd Aeneas, watching from inside his cloud, says the line that gives everything away: fortunate people, whose walls are already going up.\n\nThat is the temptation of Book IV, and it is not a woman. It is a finished city, with a functioning government, and a job."

  "beyond": "<p>Every Roman reading this knew what was going to happen to it, and the poem is written on top of that knowledge like a hand pressing on a bruise.</p><p>Carthage was the enemy Rome came closest to losing to \u2014 three wars over a hundred and eighteen years, Hannibal loose in Italy for sixteen of them, whole Roman armies annihilated at Cannae and Trasimene. And in 146 BC, Rome took the city, burned it for seventeen days, killed or enslaved everyone in it, and pulled the walls down.</p><p>So there are two erased cities in this poem, not one. [[troy|Troy]] burns in Book II and [[carthage|Carthage]] burns off the page, and everyone in the audience can see both fires, and [[dido|the woman on the pyre in Book IV]] is standing between them lighting the second.</p><p>And in [[virgil|Virgil]]'s own lifetime, [[augustus|Augustus]] refounded it \u2014 a Roman colony on the ruins, and within a century one of the largest cities in the empire.</p>",

  "sections": [

    "h": "The Door Standing Open",
    "body": "A cave in the rock above the Bay of Naples, with a hundred tunnels and a hundred mouths, and [[sibyl|a woman]] inside it fighting the god who rides her.\n\nBelow it, the way down. There is a lake with a smell coming off it that no bird will fly over. There is a ferryman who has not washed in a long time and will not take you without a burial. There are the crowds on the bank \u2014 more than the leaves that fall in the first frost, more than the birds that come in over the sea when the cold turns them \u2014 all reaching out for the other shore.\n\nThere are the fields of mourning, where those whom hard love wasted walk in a myrtle wood with their wounds still open, and [[dido|Dido]] is there.\n\nThere is a man with his face torn off who used to be a prince. There is a place of punishment that [[sibyl|the Sibyl]] will not let him enter and only describes.\n\nAnd then, at the far end, past everything, a green valley with light of its own and a sky and its own sun \u2014 and old men and boys wrestling and singing, and [[anchises|a father]] at the end of it, counting the descendants who have not been born yet."

  "beyond": "<p>This book is why [[virgil|Virgil]] became the guide.</p><p>Book VI gave the Latin West its map of the afterlife, and it did so at a moment when nobody else had one that stuck: the geography, the river, the ferryman, the crowds on the bank, the separation of the punished from the blessed. Christianity inherited a landscape that had been surveyed by a pagan.</p><p>Which is how, thirteen hundred years later, Dante opens his own poem lost in a wood and is met by a man who says he was born under Julius and sang of a son of Anchises \u2014 and Virgil walks him down through hell and up the mountain, and can go no further, because he is not saved.</p><p>And the place is real. The lake is Avernus. The cave was cut into the tufa and was opened by archaeologists in 1932: a long trapezoidal gallery, exactly as he describes it. Virgil lived twenty minutes away, and is buried on the same bay.</p>",

  "essence": "The quiet farming country at the mouth of the Tiber that the Trojans are promised \u2014 and must take by force from people who live there.",
  "sections": [
   {
    "h": "The Quiet Country",
    "body": "It is farmland. That is the shock of Book VII: after six books of storms and burning cities and the kingdom of the dead, the Trojans row up a river into a landscape of orchards and cattle and small towns, where nothing has happened for a very long time.\n\nThe king is old and has no sons. The people are described as hard, and honest, and slow \u2014 sprung from a hard root, [[virgil|Virgil]] says, carrying their sons down to the river to toughen them, hunting in the woods, farming, and calling it a good life.\n\nAnd then they are handed a war.\n\nThe [[allecto|Fury]] blows a horn and the poem tells you exactly what comes out of the farms: the ploughs abandoned, the hooked pruning-knives beaten into swords, the helmets pulled out of storage with the mould scraped off them, the shields with the silver rotting on the leather.\n\nA farming country converting itself into an army, item by item, tool by tool. [[virgil|Virgil]] wrote four books about agriculture before this one. He knew exactly what he was listing."

  "beyond": "<p>[[virgil|Virgil]] is from here, in the sense that matters. Not from Latium \u2014 from a farm near Mantua, in a country that was not yet legally Italy \u2014 but from the plough, and from a family that lost land to soldiers.</p><p>And Italy was Rome's oldest wound. Within living memory of the poem's first readers, Rome had fought the Social War against her own Italian allies: three years, tens of thousands dead, over the question of whether Italians could be Romans. They won that argument by nearly winning the war.</p><p>Then the civil wars stripped the countryside \u2014 conscription, confiscation, veterans planted on other men's farms, whole districts handed to soldiers as back pay. Virgil's own family was in one of those districts.</p><p>So the picture of a peaceful farming country being turned into an army by a supernatural rage, with the pruning hooks going into the forge, is not an antiquarian set-piece. It is the thing that had just happened, to him, told in the language of myth, which is the only language in which it was safe to tell it.</p>",

  "essence": "Two doors out of the underworld \u2014 one of horn for true visions, one of ivory for false ones. Aeneas leaves through the ivory gate, and nobody has ever fully explained why.",
  "sections": [
   {
    "h": "The Ivory Door",
    "body": "There are two gates out of the underworld, and [[virgil|Virgil]] describes them in five lines at the very end of Book VI.\n\nOne is of horn, and through it the true shades pass easily. The other is finished in gleaming white ivory, flawless \u2014 and through it the powers below send false dreams up into the world.\n\n[[anchises|Anchises]] has just finished showing his son seven hundred years of Roman glory. He walks him and [[sibyl|the Sibyl]] to the gates.\n\nAnd he sends them out through the ivory one.\n\nThen the poem changes the subject immediately \u2014 Aeneas goes back to the ships, they sail up the coast, they anchor. Not one word of explanation. Nobody in the poem ever mentions it again."

  "beneath": "<p>This is the most argued-over passage in Latin literature and no explanation has ever held.</p><p>The options, honestly stated. <em>(1)</em> It is a technicality: [[aeneas|Aeneas]] is alive, not a true shade, so the horn gate is not for him. Neat, and it makes the ivory gate mean nothing, which is a strange thing for [[virgil|Virgil]] to build and then empty. <em>(2)</em> It is about time: it is before midnight, and the ancients held that dreams before midnight were false. Ingenious, and it depends on a detail the poem does not give. <em>(3)</em> The vision is false \u2014 the parade of Roman heroes, the empire without end, the golden age, all of it is a dream sent up through the gate of lies.</p><p>The third is the one that has kept people awake for two thousand years, and it is very hard to hold. It would mean the poem's most patriotic passage is stamped, on the way out, as a lie. It would mean the man who wrote it did something no commissioned poet could survive doing.</p><p>I do not think you can settle it, and I distrust anyone who says they have. But note the structure. Virgil did not have to put a gate there at all. He chose to end the poem's central book with a door, and he chose which door.</p>",

  "sections": [

    "h": "It Must Come Away Willingly",
    "body": "[[sibyl|The Sibyl]] tells him the terms. There is a tree in a dark wood, and hidden in it is a branch of gold \u2014 leaf and stem, gold \u2014 sacred to the queen of the dead. Nobody goes down without it. And when you break one off, another grows to replace it.\n\nBut, she says, and this is the condition that has never stopped being frightening: if the fates want you, it will come away easily in your hand. If they do not, no strength on earth will move it, and no blade will cut it.\n\nHe goes into the wood not knowing where to look, and two doves \u2014 his mother's birds \u2014 fly ahead of him from feeding-ground to feeding-ground until they settle in a tree, and there it is, glinting like mistletoe in winter.\n\nAnd he grabs it, eagerly, and it resists.\n\nThat is the word: <em>cunctantem</em>. Hesitating. Reluctant. It comes away \u2014 but it holds back first."

  "beneath": "<p>Everything hangs on one word, and [[virgil|Virgil]] put it there on purpose.</p><p>The rule is stated twice and it is absolute: if you are chosen, the bough comes freely; if you are not, nothing will move it. Then the branch hesitates in [[aeneas|Aeneas]]'s hand.</p><p>It cannot mean he is not chosen \u2014 he gets it, he goes down, he comes back. But it cannot mean nothing either, because the poem has just spent ten lines telling you exactly what a reluctant bough would signify.</p><p>So it sits there, the way the [[gates_of_sleep|ivory gate]] sits there at the other end of the same book: a small, precise, load-bearing wrongness, dropped into the poem's most sacred machinery, unexplained.</p><p>(The bough had a long second life. Sir James Frazer built a twelve-volume theory of world religion on it in <em>The Golden Bough</em>, which is magnificent, and enormously influential, and has almost nothing to do with Virgil.)</p>",

  "essence": "A boy's belt, taken as a trophy and worn by the wrong man \u2014 the object the last twelve lines of the poem turn on.",
  "sections": [
   {
    "h": "The Belt",
    "body": "It is a boy's sword-belt: wide, gold-worked, heavy, engraved with a picture \u2014 fifty bridegrooms murdered on their wedding night, and the wedding chambers running with blood.\n\n[[turnus|Turnus]] takes it off [[pallas|Pallas]]'s body with his foot on the chest, and puts it on, and wears it for the rest of the war.\n\nAnd [[virgil|Virgil]] stops the battle to speak, which he almost never does: the mind of man knows nothing of fate, or of what is coming, or how to keep its balance when things go well. There will be a time, he says, when Turnus would pay anything not to have touched this boy, and will hate this day and these spoils.\n\nTwo books later, [[aeneas|Aeneas]] is standing over him with the sword up. Turnus is begging \u2014 not for his life, for his body. And Aeneas is turning. He is stopping. He is going to let him live.\n\nAnd then the man on the ground shifts his shoulder, and the light catches the studs.\n\nYou, wearing the spoils of my own, are to be taken out of my hands?\n\nThat is the last speech in the poem."

  "beneath": "<p>The <em>Aeneid</em> is a poem about objects that come back wrong, and this is the one it ends on.</p><p>Look at the pattern. [[dido|Dido]] kills herself with a sword [[aeneas|Aeneas]] left behind as an affectionate gift. [[camilla|Camilla]] dies chasing a gold breastplate. [[nisus_euryalus|Euryalus]] dies because he stole a helmet and the moon found it. And [[turnus|Turnus]] dies because he wore a dead boy's belt.</p><p>Every one of them is destroyed by a thing they wanted, or a thing they gave away without thinking.</p><p>And the engraving. The belt shows a slaughter at a wedding \u2014 worn into a war being fought over a marriage, by a man who is going to lose the bride. [[virgil|Virgil]] does not point at this once. He puts it on the object and lets it sit there for two books until it kills him.</p>",

  "essence": "Not piety \u2014 the Roman virtue of doing what you owe to gods, father, son, and state, in that order, whatever it costs the person in front of you.",
  "sections": [
   {
    "h": "Not Piety",
    "body": "It is the word the poem hangs on [[aeneas|Aeneas]] like a title, and every English translation of it is wrong.\n\nIt does not mean pious. It does not mean holy, or devout, or good. It means: you pay what you owe. To the gods, to your father, to your children, to the people who depend on you, to the state. In that order. Whether or not you want to. Whether or not it destroys the person in front of you.\n\nIt is not a warm virtue. It is a schedule of debts.\n\nSo when [[aeneas|Aeneas]] carries [[anchises|his father]] out of a burning city on his back, that is <em>pietas</em>. When he leaves [[dido|Dido]] on a beach, that is also <em>pietas</em> \u2014 the same virtue, the same man, the same afternoon's obligations, running in a different direction.\n\nAnd [[dido|Dido]], who kept a vow to a dead husband for years and broke it once, throws the word back at him with contempt."

  "beyond": "<p>This was not an abstraction. It was the regime's brand.</p><p><em>Pietas</em> appears on [[augustus|Augustus's]] coinage. It was one of the four virtues inscribed on the golden shield the senate voted him in 27 BC and hung in the senate house \u2014 courage, clemency, justice, and <em>pietas</em> \u2014 the official list of what the new order was made of.</p><p>He had earned some claim to the word by the roughest possible route: his entire political career began with a duty to a murdered father, and the proscriptions and the war that followed were, technically, filial obligation discharged.</p><p>So when [[virgil|Virgil]] gives the word to [[aeneas|Aeneas]], he is not choosing an adjective. He is putting the emperor's own advertised virtue on a man who abandons a queen, sacrifices prisoners at a funeral, and finishes the poem by killing someone who has surrendered.</p><p>The other virtue on that shield was <em>clementia</em>. Mercy. It is worth remembering which one the last four lines are about.</p>",

  "essence": "The fire in the blood: rage, passion, madness, war-lust. The thing Rome exists to shut in a room \u2014 and the last thing the poem's hero feels.",
  "sections": [
   {
    "h": "The Fire in the Blood",
    "body": "There is no single English word. Rage, madness, war-lust, frenzy, the thing that comes over you \u2014 [[virgil|Virgil]] uses it for all of them, and for the state of a country tearing itself apart.\n\nIt is what [[juno|Juno]] is. It is what [[allecto|a Fury]] pours into [[amata|a queen]] with a snake and into [[turnus|Turnus]] with a torch. It is the wound feeding in [[dido|Dido]]'s veins. It is what makes a peaceful farming country beat its pruning hooks into swords in a single afternoon.\n\nAnd [[jupiter|Jupiter]], in Book I, promises that Rome is what happens when it is finally shut away: the gates of war will close, and inside, Rage will sit on a heap of weapons with a hundred bronze chains behind his back, bound, and roaring, and horrible with a bloody mouth.\n\nThat is the poem's official argument in one image. Rome is a lock on a door.\n\nAnd in the last four lines, the man who founds Rome catches it."

  "beneath": "<p>The end of the poem is the argument of the poem, running backwards.</p><p>[[virgil|Virgil]] spends twelve books establishing <em>furor</em> as the enemy \u2014 the thing that killed [[dido|Dido]], the thing that started the war, the thing [[pietas|duty]] exists to hold down, the thing Rome will chain. And then he ends on [[aeneas|Aeneas]] <em>set alight by rage and terrible in his anger</em>, putting a sword into a man who has surrendered.</p><p>The word he uses in that last moment is <em>furiis accensus</em> \u2014 kindled by the Furies. The same fire. The same word. On the founder.</p><p>The Augustan reading says: that is a just anger and Roman law permits it, and [[pallas|the boy]] was under his protection, and a poem cannot end with the villain alive. It is not a stupid reading. It was the standard one for eighteen centuries.</p><p>The other one says: Virgil built a machine for twelve books whose only function is to identify this fire as the enemy of everything Rome claims to be \u2014 and then he lit it, in the last four lines, in the hand of the man Rome is named after, and stopped writing.</p>",

 {

  "essence": "Fate: literally \u201cthe thing spoken.\u201d Fixed, known, and no comfort to anyone \u2014 you still have to walk every step of it yourself.",
  "sections": [
   {
    "h": "The Thing Spoken",
    "body": "It is not destiny in the comfortable sense. The Latin word means, literally, <em>the thing that has been said</em> \u2014 an utterance, a pronouncement, a spoken sentence you are now inside.\n\nSo it is fixed, and it is known, and it is announced constantly \u2014 by [[jupiter|Jupiter]], by ghosts, by [[sibyl|the Sibyl]], by a harpy, by a bleeding bush \u2014 and it is no help to anybody.\n\nBecause you still have to walk it. Knowing that Italy is waiting does not sail the ships, or bury [[palinurus|the helmsman]], or tell [[dido|Dido]], or kill [[turnus|Turnus]]. The prophecies never once make anything easier. They only make it certain.\n\nAnd they are almost always misread. Seek your ancient mother, says the oracle, and [[anchises|Anchises]] says Crete, and a plague kills the settlers. You will eat your tables, says the harpy, as a curse \u2014 and it turns out to mean they will be so hungry they eat the bread they were using as plates, and it is a joke, and it is the sign they have arrived.\n\nThe future is fixed and it is written in a language nobody can read until afterward."
   }

  "beneath": "<p>The poem's hardest question is whether the fates make anything better, and it declines to answer.</p><p>Note who suffers. [[dido|Dido]] dies <em>before her day</em> \u2014 not owed to fate, not deserved \u2014 and the underworld has no procedure for her, and a goddess has to come down and process the paperwork. [[turnus|Turnus]] is opposed by the fates and fights anyway, and is the most alive person in the poem. [[aeneas|Aeneas]] has the fates entirely on his side, and is exhausted, and weeps more than anyone.</p><p>The people fate favours are miserable. The people it destroys are magnificent. That is a strange thing for a poem about a divinely ordained empire to keep demonstrating.</p><p>And [[jupiter|Jupiter]] himself does not author it. He administers it. When the final duel comes he does not choose the winner \u2014 he holds up a pair of scales and lets them tip.</p>",

 {
  "id": "epic_machine",
  "name": "The Epic Machine",
  "type": "world",

  "themes": [
   "th_rome"

  "essence": "How the poem actually worked on its first audience: hexameter read aloud, invocations, similes, catalogues, and a form everyone in the room knew by heart.",
  "sections": [
   {
    "h": "How It Actually Worked",
    "body": "It is not a novel and it was not read silently in a chair.\n\nIt is in <em>dactylic hexameter</em> \u2014 six beats a line, a long rolling metre with no rhyme, the standard measure of epic since Homer. Latin verse worked on the length of syllables rather than stress, so a line has a weight and a drag to it that no English translation can carry. [[virgil|Virgil]] is generally reckoned the greatest technician who ever used it.\n\nIt was performed. Poets read aloud to invited audiences \u2014 Virgil read Books II, IV and VI to [[augustus|Augustus]] in a room \u2014 and educated Romans read even privately with their lips moving.\n\nAnd it comes with fixed furniture, which the audience knew by heart and enjoyed the way you enjoy a familiar chord change. The invocation of the Muse. The epithet welded to a name (<em>pius Aeneas</em>, <em>faithful Achates</em>). The extended simile \u2014 a whole small landscape dropped in beside the action. The catalogue of forces. The descent to the dead. The description of a made object (the [[shield|shield]]) that stops the plot dead for a hundred lines.\n\nNone of it is decoration. It is the machine, and knowing it is there makes the poem twice as loud."
   }
  ],
  "beyond": "<p>The first three words are the whole announcement: <em>arma virumque cano</em> \u2014 arms, and the man, I sing.</p><p><em>Arma</em> is the <em>Iliad</em>, a poem about war. <em>Virum</em>, the man, is the <em>Odyssey</em>, whose first word is a man. In three words [[virgil|Virgil]] tells a room full of people who have Homer by heart that he is going to do both, and that he is going to do it in twelve books rather than forty-eight.</p><p>It worked. Within a generation Roman schoolchildren were being drilled in him line by line. And in Pompeii, buried in 79 AD, the opening words are scratched on walls \u2014 in the handwriting of people practising their letters, and once, wonderfully, altered by a fuller to read <em>fullones ululamque cano</em>: I sing of fullers and an owl.</p><p>He became a national possession within about twenty years of dying, and the graffiti proves it: you only parody what everybody already knows.</p>",

 {
  "id": "homer",
  "name": "The Homeric Inheritance",
  "type": "world",

  ],
  "essence": "Virgil is competing with a dead Greek across twelve books \u2014 six of wandering to answer the Odyssey, six of war to answer the Iliad, and he tells you so.",
  "sections": [
   {
    "h": "Competing with a Dead Greek",
    "body": "He tells you in the first three words. <em>Arma virumque</em> \u2014 arms, and the man. Arms is the <em>Iliad</em>. The man is the <em>Odyssey</em>, which opens on one.\n\nAnd the structure delivers on it. Books I\u2013VI: a man trying to get home over water, blown off course, telling his story at a foreign court, visiting the dead. That is the <em>Odyssey</em>. Books VII\u2013XII: two armies, a doomed champion, a duel, a body. That is the <em>Iliad</em>.\n\nHe does it in twelve books. Homer needed forty-eight.\n\nAnd he swerves constantly, and the swerves are where he lives. [[aeneas|Aeneas]] is not going home; his home is ash, and there is nothing to go back to. Odysseus leaves Calypso and returns to his wife; Aeneas leaves [[dido|Dido]] and marries a stranger he never speaks to. Achilles kills Hector out of grief for a dead friend and then gives the body back. [[aeneas|Aeneas]] kills [[turnus|Turnus]] out of grief for [[pallas|a dead boy]], and the poem stops before anybody asks for the body."
   }
  ],
  "beyond": "<p>Roman literature was, by its own account, a response. Educated Romans read Greek, learned rhetoric from Greek models, and lived with the fact that everything they made had been made first, and often better, by people they had conquered. Horace put it exactly: captive Greece took her savage victor captive.</p><p><em>Imitatio</em> was not plagiarism and it was not a failure of nerve. It was the discipline: you took a model everyone knew, and you were judged on what you did to it. The audience is meant to hear the original underneath \u2014 that is the pleasure, and it is also the argument.</p><p>So when the cave scene in Book IV is lifted from Apollonius's <em>Argonautica</em>, where Jason and Medea marry in a cave, an educated Roman heard it \u2014 and heard, underneath [[dido|Dido]]'s wedding, the story of a woman who ends by murdering her own children.</p><p>[[virgil|Virgil]] was accused of theft in his own lifetime. He is supposed to have answered that it would be easier to steal Hercules' club than a line from Homer.</p>",

 {

  "essence": "A hundred and eighteen years of war with Carthage that ended with the city erased \u2014 which every listener heard inside Dido's dying curse.",
  "sections": [
   {
    "h": "A Hundred and Eighteen Years",
    "body": "Rome and [[carthage|Carthage]] fought three times, and the second one nearly ended Rome.\n\nHannibal came over the Alps with elephants and spent sixteen years loose in Italy, and at Cannae in 216 BC he destroyed a Roman army so completely that the number of dead \u2014 perhaps fifty thousand in an afternoon \u2014 was not matched on a single day again until the twentieth century. Rome ran out of men. They enrolled slaves. Mothers in the city knew what the word Hannibal meant for the rest of their lives.\n\nRome won anyway, slowly, and then did it again fifty years later for no compelling reason, and in 146 BC took the city, burned it for seventeen days, sold the survivors, and pulled the walls down.\n\nThe elder Cato is said to have ended every speech he gave in the senate, on any subject at all, with the words: and furthermore, I judge that Carthage must be destroyed."
   }

  "beyond": "<p>This is the knowledge [[dido|Dido]]'s curse is written on top of.</p><p>When she stands on the pyre and prays for an avenger to rise out of her bones and hunt them with fire and iron \u2014 shore against shore, wave against wave, weapons against weapons, them and their children's children \u2014 nobody in [[virgil|Virgil]]'s audience had to be told who she meant.</p><p>And here is what he has done. He has taken the defining trauma of Roman history, the war that nearly killed the state, and given it a personal cause \u2014 and made Rome the guilty party. Hannibal is not a barbarian appetite. He is a woman's dying grievance, and the grievance is legitimate, and the man who caused it is the founder of Rome.</p><p>Nobody commissioned that. It is one of the strongest pieces of evidence that this poem is not, or not only, the thing it was paid to be.</p>",

 {

  "essence": "Rome did nothing without asking: birds, entrails, thunder, lots. The poem's prophecies are not decoration \u2014 they are how public business was actually done.",
  "sections": [
   {
    "h": "Asking Permission",
    "body": "Rome did not do anything important without checking.\n\nBefore a battle, before a vote, before a building, magistrates took the auspices \u2014 they watched birds. Direction of flight, kind of bird, the noise it made. Armies travelled with sacred chickens, and if the chickens would not eat, you did not fight that day. (A commander who threw them into the sea in 249 BC, saying that if they would not eat they could drink, lost the battle and was prosecuted for it.)\n\nPriests read the entrails of sacrificed animals \u2014 the liver especially, lobe by lobe. Lightning was read by quadrant. Prodigies were reported to the senate as public business: a rain of stones, a talking ox, a statue that sweated.\n\nAnd the [[sibyl|Sibylline Books]] were state papers, locked on the Capitol, opened only by decree, at moments of national terror.\n\nSo when the poem stops so that somebody can interpret a flight of swans, or a flame in [[ascanius|a boy's]] hair, or a horse's head dug out of the ground, this is not superstition dressed as plot. It is how the Roman state made decisions, and the audience had watched it done."

  "beyond": "<p>Which is why the misreadings in the poem are so dangerous.</p><p>[[anchises|Anchises]] gets the oracle wrong and a colony dies of plague. The Trojans see swans and read them optimistically. [[latinus|Latinus]] gets an unambiguous instruction and cannot act on it. The signs are always true and almost always useless.</p><p>And [[augustus|Augustus]] knew the value of this machinery precisely. He held the office of <em>pontifex maximus</em> \u2014 chief priest \u2014 from 12 BC. He revived lapsed rituals and rebuilt eighty-two temples. He moved the [[sibyl|Sibylline Books]] into the temple of Apollo beside his own house on the Palatine, and had a great many of the oracles burned as forgeries first.</p><p>The man who controlled what the gods had said also controlled the archive of what they had said. [[virgil|Virgil]] wrote a poem full of prophecies for him.</p>",

  "essence": "A Roman wife had no vote, no public office, and a husband's authority over her \u2014 which is why a foreign queen commanding a city was both thrilling and a warning.",
  "sections": [
   {
    "h": "What a Woman Could Be",
    "body": "She could not vote. She could not hold office, or sit in the senate, or command anything. In the old law she passed from her father's authority to her husband's, and although by [[augustus|Augustus's]] day many women were in practice financially independent, none of them was a citizen in the sense that mattered.\n\nWhat she could be was a mother, and the ideal was stated on tombstones with a brevity that tells you everything: <em>she kept the house, she made wool</em>.\n\nAnd then [[augustus|Augustus]] legislated. He made adultery a public crime prosecutable by the state \u2014 previously a family matter \u2014 and penalised the unmarried and childless, and rewarded women who bore three children. He was trying to restart the aristocracy. He later exiled his own daughter under his own law.\n\nNow put [[dido|Dido]] in that room. A woman running a state, founding a city, commanding men, choosing her own bed, and telling a king to his face that she will not marry him."

  "beyond": "<p>The poem's women are not decorative and they are not safe, and that is the point of them.</p><p>[[dido|Dido]] governs better than [[aeneas|Aeneas]] does. [[camilla|Camilla]] outfights everyone on the field. [[amata|Amata]] runs a queen's rebellion. The [[sibyl|Sibyl]] holds the keys to the underworld. And the Trojan women, exhausted after seven years at sea, burn the fleet in Book V because they have simply had enough \u2014 the only entirely rational act of rebellion in the poem, and it nearly ends the mission.</p><p>And they are all destroyed, or silenced, or both. Dido on the pyre. Camilla with a spear in her chest. Amata on a rope. [[lavinia|Lavinia]], who founds the Roman line, never speaks.</p><p>A Roman reader would have felt [[dido|Dido]] as thrilling and as a warning at the same time \u2014 and would have had a recent, specific example in mind. Cleopatra had been dead about ten years. A foreign queen, ruling alone, who took a Roman commander away from his duty. She is on the [[shield|shield]], pale with the death that is coming.</p>",

    "h": "Fifty-Eight Unfinished Lines",
    "body": "There are fifty-eight lines in the <em>Aeneid</em> that stop in the middle.\n\nThey are not corrupt or damaged. They are simply short: a line begins, runs three or four feet, and ends. In the manuscripts, in every edition, in the Latin you would buy today, they just stop.\n\n[[virgil|Virgil]] died with the poem unrevised, and his friends were ordered to publish it and to add nothing. So nobody ever finished them, in two thousand years, and it is one of the great acts of editorial restraint in literary history.\n\nOne of them is spoken by [[dido|Dido]]. She is trying to be reasonable, and she says: I would have been happy, more than happy, if only the Trojan ships had never touched my shore \u2014 and then, a few lines earlier, in the middle of her fury, she breaks off: I would have carried war into Italy, I would have set fire to their camps, I would have killed the father and the son and myself and thrown the lot on the fire \u2014\n\nAnd the line stops.\n\nIt is an accident. It is impossible to read it as one."

  "essence": "What later ages did with it: a fortune-telling book, a guide through Dante's hell, a schoolroom bludgeon, and finally a poem about the price of empire.",
  "sections": [
   {
    "h": "Two Thousand Years",
    "body": "He was a schoolbook within a generation of dying, and he never stopped being one. That is a fate as well as an honour.\n\nThe late Romans used him as an oracle: you opened the book at random, put your finger on a line, and read your future \u2014 the <em>Sortes Vergilianae</em>. Emperors did it. Charles I is said to have done it, and got the passage about a king driven from his kingdom.\n\nThe Middle Ages decided he had prophesied Christ. In his fourth <em>Eclogue</em> he had written about a boy whose birth would begin a golden age, and Christian readers concluded he must have been an unwitting pagan prophet. It made him safe to teach for a thousand years, and it is almost certainly wrong.\n\nDante made him a character: the guide through hell and up the mountain, the sweet master, who can go no further because he is not saved and must turn back and go home to Limbo. It is the most beautiful compliment one poet ever paid another and it is also a sentence.\n\nAnd then, in the twentieth century, after two world wars, readers picked him up and found something nobody had been talking about: the cost. The Harvard critics called them the <em>further voices</em> \u2014 the poem's dissenting undercurrent, the queen on the pyre, the boys in the field, the last four lines."

  "beyond": "<p>Be careful here, because this is where I have my thumb closest to the scale.</p><p>The pessimistic reading of the <em>Aeneid</em> is roughly seventy years old. For the preceding nineteen centuries, readers who were not stupid \u2014 Augustine, Dante, Dryden, Tennyson \u2014 read it as a poem of imperial glory with tragic shading, and were not embarrassed by the ending.</p><p>It is worth asking why the countercurrent became visible exactly when it did: after 1945, in America, among people who had begun to have complicated feelings about being the empire. That is not a knockdown argument against the reading. But it is a reason to hold it a little more loosely than its confidence invites, and to notice that the poem has an unnerving habit of reflecting whoever is holding it.</p><p>What survives all of it is the thing nobody argues about: <em>sunt lacrimae rerum</em> \u2014 there are tears in things, and mortal matters touch the mind. [[aeneas|Aeneas]] says it in Book I, in front of a mural of his own dead war, in a foreign country, having just realised that his catastrophe arrived before he did.</p>",

  "h": "A fleet is wrecked into a stranger's harbour",
  "s": "The poem begins with a question, not a boast. [[virgil|Virgil]] says he will sing of arms and a man, driven by fate from [[troy|Troy]] to Italy, harried the whole way by the anger of a goddess \u2014 and then he stops and asks: can there be anger like this in the minds of gods?\n\nHe never answers it.\n\n[[juno|Juno]] loves [[carthage|Carthage]] and has read the future and knows that a Trojan bloodline is going to pull it down. She cannot change that. So she goes to [[aeolus|Aeolus]], who keeps the winds shut inside a hollow mountain, and offers him a nymph.\n\nHe turns his spear round and drives the point into the side of the mountain, and the door opens, and they all come out at once.\n\nThe first thing that happens in the poem is a minor official taking a bribe.\n\nThe fleet is hit broadside on open water. Ships turned across the swell, a wave standing over them like a mountain, men hanging in the water, and the wreckage of a country \u2014 planks, gear, the treasure of Troy \u2014 floating between the crests. [[aeneas|Aeneas]] stretches his hands to the stars and says the first words we ever hear from him: three times, four times luckier were the ones who died in front of their fathers under the walls of Troy.\n\nThat is our hero. He is introduced wishing he were dead.\n\n[[neptune|Neptune]] puts his head up out of the water and is furious \u2014 not about the drowning, about the trespass \u2014 and the sea goes flat in four lines. Seven ships out of twenty come into an African harbour. And the harbour is Juno's, and there is a queen in it.",
  "stage": "<p>The first seven words are the whole manifesto: <em>arma virumque cano</em>, arms and the man I sing. <em>Arma</em> is the <em>Iliad</em>. <em>Virum</em> is the <em>Odyssey</em>, which opens on a man. In three words [[virgil|Virgil]] tells a room that knows [[homer|Homer]] by heart that he intends to do both, in a quarter of the space.</p><p>Then the invocation \u2014 <em>Muse, tell me the causes</em> \u2014 which is standard furniture, and then the question that is not standard at all. Homer's epics do not begin by asking whether the gods are behaving disgracefully.</p><p>And watch the simile when [[neptune|Neptune]] calms the sea: a mob rioting with stones and torches, quieted by the arrival of a man of weight and public service. It is the first simile in the poem, and it compares the sea to a political crisis, and the god to a statesman. A Roman audience ten years out of civil war did not miss it.</p>",
  "turns": "<p>Everything after this is downstream of a goddess's grudge and a wind-keeper's bribe. The poem is telling you, in its first hundred lines, that the founding of Rome runs on divine spite and cheap favours.</p><p>The moment to watch is [[aeneas|Aeneas]]'s first speech. He does not rally anyone. He wishes he had died at home. Ten lines later he makes a speech to the crew that is brave and calm and encouraging \u2014 and [[virgil|Virgil]] tells you, flatly, that he faked it: sick with the weight of it, he put on hope in his face and kept the grief pushed down.</p><p>That is the man. He performs the leader, and the poem shows you the performance from inside on page one.</p>"

  "h": "Jupiter unrolls the future, and a mother lies to her son",
  "s": "Up in heaven [[venus|Venus]] is crying, and [[jupiter|Jupiter]] smiles \u2014 the smile with which he clears the sky \u2014 and kisses his daughter and tells her to stop.\n\nAnd then he unrolls it. Her son will fight a war and win it. [[ascanius|The boy]] will move the capital. Three hundred years of Alban kings, and then a she-wolf, and then Romulus, and then a people to whom he sets no boundary in space or in time.\n\n<em>Imperium sine fine dedi.</em> I have given them empire without end.\n\nDown on the beach, [[aeneas|Aeneas]] is walking inland to find out what country he has been wrecked into, and a girl comes out of the woods with her hair loose and a bow, dressed for hunting, and asks if he has seen her sisters.\n\nIt is his mother. She will not say so.\n\nShe gives him directions, and [[dido|Dido]]'s whole life story, and a good omen about his missing ships, and she is turning to go when the disguise slips \u2014 her hair, her neck, the way she suddenly moves.\n\nAnd he says the bitterest thing he ever says to anybody: why do you keep mocking your own son with false shapes? Why can we never take each other's hand, or say a true word?\n\nShe does not answer. She wraps him in a cloud and sends him into the city.\n\nAnd what he finds there is a building site with a queen in it \u2014 and, on the wall of a temple, in a foreign country, a mural of his own dead war. There is [[priam|Priam]]. There is [[hector|Hector]] being dragged round the walls. There is Aeneas himself, a face in a battle scene, painted by strangers.\n\nHe stands in front of it and cries, and says the line the poem is best remembered by: there are tears in things, and mortal matters touch the mind.",
  "stage": "<p>Two words in [[jupiter|Jupiter]]'s speech have done more work in Western history than anything else in Latin: <em>sine fine</em>. Without end. Not merely vast \u2014 unbounded, unlimited, with no term at all. It is the most extravagant promise any god makes in the poem, and it is made to calm an anxious mother down.</p><p>And <em>sunt lacrimae rerum</em> \u2014 there are tears in things \u2014 is untranslatable and everyone has tried. It might mean the world has tears in it; it might mean these events have their tears, meaning someone here weeps for us. [[virgil|Virgil]] built it so that it can be both, and it has been quoted at funerals for two thousand years by people who did not know it is said in front of a painting.</p>",
  "turns": "<p>The empire is promised before a single person has died. That is the poem's opening bid, and every death from here is charged against it.</p><p>The moment to watch is the mural. [[aeneas|Aeneas]] weeps not from grief but from a stranger discovery: his catastrophe has travelled ahead of him and arrived as decoration. Somebody in Africa has painted his war on a wall and put him in it, and he is a figure in someone else's story about someone else's tragedy.</p><p>That is what it is to be the founder of Rome six hundred years early: you are already an image, and you cannot read yourself.</p>"

  "h": "The night the horse opened",
  "s": "They wake up and the beach is empty. Ten years of Greeks, gone \u2014 tents struck, ships away, the sand marked where the lines had been. And in the middle of it, a wooden [[horse|horse]] the size of a building.\n\nThe city comes out and stands around it and cannot agree. Some want it inside. Some want it thrown off the cliff, or burned, or drilled into. [[troy|Troy]], [[aeneas|Aeneas]] says, was split into two minds \u2014 and that sentence is the whole catastrophe, before anything has happened.\n\n[[laocoon|A priest]] comes down the hill shouting. Are you mad? Do you think they have gone? Do you know these people at all? And he throws a spear into its flank, and it sticks, and the hollow belly of it groans.\n\nThen they bring in a prisoner. [[sinon|Sinon]] stands with his hands tied and cries, and tells them the Greeks were going to sacrifice him and he ran, and he has nothing left, and he hates them.\n\nA city that has been under siege for ten years and wants very badly to believe something believes him.\n\nAnd then he explains the horse, and the lie is a small masterpiece. It is an offering, he says, and they built it enormous <em>on purpose</em>, so that it could never be brought through the gates \u2014 because if it ever went inside the walls, Troy would stand forever, and Greece would fall.\n\nHe tells them, in effect: do not take this into the city.\n\nAnd then two serpents come across the water with their crests above the waves and eat the priest and both of his small sons in front of everybody, and the city concludes that he had it coming for throwing a spear at a sacred object.\n\nSo they pull down a section of wall. Boys and unmarried girls sing hymns and touch the rope. Four times it sticks in the gateway, and four times the weapons inside it clash, and nobody stops.\n\nWe \u2014 blind, insane \u2014 planted it on the sacred citadel.",
  "stage": "<p>This whole book is [[aeneas|Aeneas]] talking. He is at a dinner table in [[carthage|Carthage]], in front of a woman who asked him to tell it from the beginning, and the entire fall of Troy is a first-person after-dinner narration \u2014 which means every judgement in it (<em>we, blind, insane</em>) is his, not the poem's.</p><p>That is a defence brief, and it had to be. There was an old and hostile tradition that Aeneas got out of Troy because he betrayed it to the Greeks. Giving him a whole book to tell it himself, fighting until gods physically restrain him, is [[virgil|Virgil]] answering a charge \u2014 and it worked so well that almost nobody now knows there was one.</p><p>And notice the technique of the lie. [[sinon|Sinon]] never asks them to bring the horse in. He tells them not to. He tells them it would be a disaster <em>for the Greeks</em> if they did. It is the oldest trick in persuasion and [[virgil|Virgil]] writes it perfectly.</p>",
  "turns": "<p>The city is not defeated. It votes.</p><p>That is what turns here, and it is the reason Book II is unbearable rather than merely sad. Every step is a choice made in public by people who have been given the evidence: a priest who is right, a wall they have to demolish themselves, a horse that clanks four times in the gate. They choose, and they sing while they do it.</p><p>The irony no first-time reader catches: [[laocoon|Laoco\u00f6n]]'s death <em>proves the gods are angry</em>, which is true \u2014 and the city draws exactly the wrong conclusion from a correct premise. The signs in this poem are always honest and almost never legible.</p>"

  "stage": "<p>Watch the body move. He is killed at the palace altar, at the top of the citadel \u2014 and two lines later he is lying on a beach. Nobody carried him there. [[virgil|Virgil]] simply relocates the corpse, without explanation, and the image is not Trojan at all.</p><p>It is Pompey the Great: beheaded in the surf on an Egyptian shore in 48 BC, his body left on the sand, his head carried off in a bag. The most famous death in living Roman memory, and the one that opened the last round of the civil wars.</p><p>Virgil does not draw the parallel. He puts the body in the wrong place and lets his audience flinch. This is how he works when he is serious.</p>",

  "stage": "<p>The carry became the single most reproduced image in Roman art: a man with an old man on his shoulder and a child at his hand. It is on coins, on wall-paintings in Pompeii, on the altar of [[augustus|Augustus]]'s peace. It is the entire ideology of the regime in one silhouette \u2014 the past carried, the future led, the household gods saved.</p><p>[[virgil|Virgil]] gives the image its most famous line and then quietly ruins it: <em>and I shortened my stride to the boy's short steps</em>. That is not an emblem. That is a parent walking.</p><p>And the three failed embraces are a repeated figure \u2014 he will do exactly the same thing to [[anchises|his father's ghost]] in Book VI, three times, and fail three times. The poem's hero cannot hold on to anyone he has lost.</p>",
