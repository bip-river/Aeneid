/* the single linkify pass. every prose surface goes through this. */
function linkify(s){
  if(s === undefined || s === null) return "";
  return String(s).replace(/\[\[([a-z0-9_]+)(?:\|([^\]]+))?\]\]/g, function(m, id, label){
    var e = BYID[id];
    var text = esc(label || (e ? e.name : id));
    if(!e) return '<span class="term broken">BROKEN:' + esc(id) + '</span>';
    return '<span class="term" data-term="' + id + '" tabindex="0" role="button">' + text + '</span>';
  });
}
/* paragraph-aware helpers: impossible to render prose without linkifying */
function paras(s){
  return String(s || "").split("\n\n").map(function(p){ return "<p>" + linkify(p) + "</p>"; }).join("");
}
function panel(cls, label, html){
  if(!html) return "";
  return '<details class="panel ' + cls + '"><summary>' + esc(label) + '</summary><div class="pbody">' + linkify(html) + '</div></details>';
}

/* ---------- popover ---------- */
var pop = document.getElementById("pop");
var popOpen = false;
function openPop(el, id){
  var e = BYID[id]; if(!e) return;
  pop.innerHTML =
    '<div class="pname">' + esc(e.name) + '</div>' +
    (e.pron ? '<div class="ppron">' + esc(e.pron) + '</div>' : '') +
    '<div class="pess">' + linkify(e.essence) + '</div>' +
    '<button class="pgo" data-go="' + id + '">Open ' + esc(e.name) + '</button>';
  pop.classList.add("on"); popOpen = true;
  if(window.innerWidth > 560){
    var r = el.getBoundingClientRect();
    var top = window.scrollY + r.bottom + 8;
    var left = Math.min(window.scrollX + r.left, window.scrollX + window.innerWidth - pop.offsetWidth - 16);
    pop.style.top = top + "px"; pop.style.left = Math.max(8, left) + "px";
  } else { pop.style.top = ""; pop.style.left = ""; }
}
function closePop(){ pop.classList.remove("on"); popOpen = false; }

/* capture phase: a dismiss click is consumed and fires nothing underneath */
document.addEventListener("click", function(ev){
  var t = ev.target;
  if(popOpen && !pop.contains(t) && !(t.closest && t.closest(".term"))){
    closePop(); ev.stopPropagation(); ev.preventDefault(); return;
  }
}, true);

document.addEventListener("click", function(ev){
  var go = ev.target.closest && ev.target.closest("[data-go]");
  if(go){ closePop(); nav("#entity/" + go.getAttribute("data-go")); ev.stopPropagation(); return; }
  var term = ev.target.closest && ev.target.closest(".term");
  if(term && !term.classList.contains("broken")){
    ev.stopPropagation(); ev.preventDefault();
    var id = term.getAttribute("data-term");
    if(popOpen && pop.getAttribute("data-for") === id){ closePop(); return; }
    pop.setAttribute("data-for", id);
    openPop(term, id);
    return;
  }
  var card = ev.target.closest && ev.target.closest("[data-nav]");
  if(card){ nav(card.getAttribute("data-nav")); }
});
document.addEventListener("keydown", function(ev){
  if(ev.key === "Escape" && popOpen) closePop();
  if(ev.key === "Enter" && ev.target.classList && ev.target.classList.contains("term")) ev.target.click();
});
window.addEventListener("scroll", function(){ if(popOpen && window.innerWidth > 560) closePop(); }, {passive:true});

/* ---------- routing ---------- */
var VIEWS = [
  {hash:"#home",  label:"Start Here"},
  {hash:"#cost",  label:"What Rome Cost"},
  {hash:"#books", label:"The Twelve Books"},
  {hash:"#cast",  label:"Who's Who"},
  {hash:"#index", label:"A\u2013Z"}
];
var stack = [];
var scrollMem = {};
function nav(h){
  scrollMem[location.hash || "#home"] = window.scrollY;
  if(location.hash && location.hash !== h) stack.push(location.hash);
  location.hash = h;
}
function goBack(){
  var prev = stack.pop();
  if(prev){ history.replaceState(null, "", prev); render(true); }
  else { location.hash = "#home"; }
}
document.getElementById("back").addEventListener("click", goBack);

function tabs(active){
  var n = document.getElementById("tabs");
  n.innerHTML = VIEWS.map(function(v){
    return '<button data-nav="' + v.hash + '" aria-current="' + (v.hash === active ? "true" : "false") + '">' + esc(v.label) + '</button>';
  }).join("");
}

/* ---------- views ---------- */
function vHome(){
  return '' +
  '<div class="eyebrow">A companion to</div>' +
  '<h1 class="disp">The Aeneid</h1>' +
  '<div class="pron">' + linkify("ih-NEE-id &middot; by [[virgil|Virgil]], 29\u201319 BC, unfinished") + '</div>' +
  '<p class="essence">A refugee carries his father out of a burning city and spends the rest of his life paying for a country he will never see.</p>' +
  '<hr class="ashline">' +

  '<h2>What this is</h2>' +
  paras("A Latin epic in twelve books, written by [[virgil|Virgil]] over the last eleven years of his life, at the request of [[augustus|Augustus]] \u2014 the man who had just ended a century of Roman civil war by winning it. It was meant to be a national poem. It is a national poem. It is also the saddest thing in Latin, and Virgil died before he could finish it, asking that it be burned.") +

  '<h2>The situation</h2>' +
  paras("[[troy|Troy]] has fallen. A Trojan prince called [[aeneas|Aeneas]] (ih-NEE-us) escapes the burning city with his father on his back, his small son by the hand, and a few hundred survivors \u2014 and his wife lost somewhere behind him in the smoke.\n\nHe has been told, by gods and ghosts and oracles, that he is to sail west and found a city in Italy from which, in six hundred years, Rome will grow. He does not want to. He has been at sea for seven years. He is, when the poem opens, in a storm off the coast of Africa, wishing aloud that he had died at home.") +

  '<h2>The backstory the poem assumes</h2>' +
  paras("Two things. First, the Trojan War: ten years of Greeks besieging Troy, ended by a wooden [[horse|horse]] and a night of slaughter. Homer told that story seven centuries earlier, and Virgil expects you to know it \u2014 [[homer|he is competing with it]] on purpose, six books of wandering to answer the <em>Odyssey</em>, six of war to answer the <em>Iliad</em>.\n\nSecond, [[juno|Juno]] (JOO-noh), queen of the gods, hates Trojans. She was insulted in a beauty contest by one, she loves [[carthage|Carthage]] and knows Rome will destroy it, and she is going to spend twelve books trying to stop this man landing. The poem's first real question is asked in its opening lines: can there be anger like this in the minds of gods?") +

  '<h2>Why it lasts</h2>' +
  paras("Because Virgil kept the receipts. The poem was commissioned to celebrate an empire, and it does \u2014 [[jupiter|Jupiter]] promises an empire without end, and a god forges [[shield|a shield]] with Rome's future on it. But Virgil also counted, one by one, the people the empire was built on: a wife, a father, a helmsman, a queen, and a long line of boys. He gave the enemies the best speeches. He ended the whole thing not on a triumph but on a man killing a beaten opponent in a rage.\n\nThat tension has never been resolved, and it is why the poem is still argued about. This app takes it seriously enough to make the argument the spine.") +

  '<h2>How to use this</h2>' +
  paras("Pick any way in. <strong>What Rome Cost</strong> walks the ledger of the dead, in order, each with what their death bought \u2014 the poem's own accounting, not ours. <strong>The Twelve Books</strong> walks the story. <strong>Who's Who</strong> is the cast, mortal and divine. <strong>A\u2013Z</strong> is everything.\n\nAny highlighted name can be tapped for a quick look \u2014 who they are, how to say it \u2014 and tapped again to open them properly. Every name in this poem is sayable; none of them are obvious.") +

  '<div class="note">' + linkify("Two names to get right before you start: [[aeneas|Aeneas]] is ih-NEE-us, and [[dido|Dido]] is DY-doh. They are the two people this poem is really about, and it never quite decides which.") + '</div>' +
  '<hr class="ashline">' +
  '<button class="card" data-nav="#cost"><h3>Begin with the ledger</h3><div class="ess">Thirteen deaths, in the order the poem charges them.</div></button>';
}

function vCost(){
  var h = '<div class="eyebrow">The lens</div><h1 class="disp">What Rome Cost</h1>' +
  '<p class="essence">The poem counts. This is what it counted.</p>' +
  paras("[[neptune|Neptune]] agrees to calm the sea and states his fee in advance: <em>unum pro multis dabitur caput</em> \u2014 one head shall be given for many. He takes [[palinurus|the helmsman]] that night.\n\nThat is the <em>Aeneid</em> doing its own bookkeeping, in its own words. Every step toward Italy is charged to someone, and Virgil names them. Read down the column: the ember cools as you go, and the entries stop buying anything.") +
  '<hr class="ashline">';
  h += '<div class="ledger">';
  COST.forEach(function(c, i){
    var e = BYID[c.id];
    var t = i / (COST.length - 1);
    var col = t < .5 ? "#f6b04a" : (t < .8 ? "#e2712a" : "#6b6058");
    h += '<div class="led card" style="--emb:' + col + '">' +
      '<div class="book">' + esc(c.bk) + '</div>' +
      '<h3><a class="ledname" href="#entity/' + c.id + '">' + esc(e ? e.name : c.id) + '</a>' + (e && e.pron ? ' <span class="pron">' + esc(e.pron) + '</span>' : '') + '</h3>' +
      '<div class="lost">' + linkify(c.lost) + '</div>' +
      '<div class="bought"><b>What it bought</b>' + linkify(c.bought) + '</div>' +
      panel("voices", "In the room", c.scene) +
    '</div>';
  });
  h += '</div>';
  h += '<div class="note">' + linkify("The last four entries buy nothing. That is not an accident of my arrangement \u2014 it is the shape of the poem. [[virgil|Virgil]] stops making the argument work at exactly the point where Rome starts winning.") + '</div>';
  return h;
}

function beatParas(s){ return paras(s); }

function vBooks(){
  var h = '<div class="eyebrow">The sequence</div><h1 class="disp">The Twelve Books</h1>' +
  '<p class="essence">Six books of wandering, six of war \u2014 the Odyssey answered, then the Iliad.</p>' +
  paras("[[homer|Virgil built it that way on purpose]] and said so. Book VI, the descent to the dead, is the seam.") + '<hr class="ashline">';
  var lastHalf = "", lastBk = 0;
  BEATS.forEach(function(b){
    if(b.half !== lastHalf){ h += '<div class="half">' + esc(b.half) + '</div>'; lastHalf = b.half; }
    if(b.bk !== lastBk){
      h += '<div class="bookhead"><span class="num">' + esc(b.k) + '</span></div>';
      lastBk = b.bk;
    }
    h += '<div class="card beat">' +
      '<h3>' + esc(b.h) + '</h3>' +
      '<div class="gloss">' + esc(b.g) + '</div>' +
      beatParas(b.s) +
      panel("voices", "Virgil's Hand", b.stage) +
      panel("ear", "What Turns Here", b.turns) +
    '</div>';
  });
  return h;
}

function vCast(){
  var order = ["mortal","god","place","object","concept","world"];
  var gloss = {
    mortal:"The people who pay.",
    god:"The people who decide.",
    place:"Four grounds: one burnt, one doomed, one underground, one promised.",
    object:"Things that come back wrong.",
    concept:"Three Latin words the poem is arguing about.",
    world:"What Virgil's first audience already knew, and you do not \u2014 read these and the poem gets louder."
  };
  var h = '<div class="eyebrow">The cast</div><h1 class="disp">Who\u2019s Who</h1>' +
    '<p class="essence">Mortals, gods, and the world the poem assumes.</p><hr class="ashline">';
  order.forEach(function(t){
    var list = ENTITIES.filter(function(e){ return e.type === t; });
    if(!list.length) return;
    h += '<div class="group"><h2>' + esc(TYPE_LABEL[t]) + '</h2><div class="gl">' + esc(gloss[t]) + '</div>';
    list.forEach(function(e){ h += entCard(e); });
    h += '</div>';
  });
  return h;
}

function entCard(e){
  var authored = !!(e.sections && e.sections.length);
  return '<button class="card" data-nav="#entity/' + e.id + '">' +
    '<h3>' + esc(e.name) + (e.pron ? ' <span class="pron">' + esc(e.pron) + '</span>' : '') +
    (e.tier === "major" ? '<span class="tag major">Major</span>' : '') +
    (!authored ? '<span class="tag stub">Essence only</span>' : '') +
    '</h3>' +
    '<div class="ess">' + linkify(e.essence) + '</div>' +
  '</button>';
}

function vIndex(){
  var list = ENTITIES.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
  var h = '<div class="eyebrow">Reference</div><h1 class="disp">A\u2013Z</h1>' +
    '<p class="essence">Everything in the poem, alphabetically, with how to say it.</p><hr class="ashline"><div class="idx">';
  list.forEach(function(e){
    h += '<a href="#entity/' + e.id + '">' + esc(e.name) + (e.pron ? '<span class="ip">' + esc(e.pron) + '</span>' : '') + '</a>';
  });
  return h + '</div>';
}

function vEntity(id){
  var e = BYID[id];
  if(!e) return '<h1 class="disp">Not found</h1>' + paras("No entry with that id.");
  var h = '<div class="eyebrow">' + esc(TYPE_LABEL[e.type] || "") + '</div>' +
    '<h1 class="disp">' + esc(e.name) + '</h1>' +
    (e.pron ? '<div class="pron">' + esc(e.pron) + (e.aka ? ' &middot; also ' + esc(e.aka) : '') + '</div>' : (e.aka ? '<div class="pron">also ' + esc(e.aka) + '</div>' : '')) +
    '<p class="essence">' + linkify(e.essence) + '</p>';

  if(e.themes && e.themes.length){
    h += '<div style="margin-top:.7rem">' + e.themes.map(function(t){
      var th = BYTHEME[t];
      return '<span class="tag">' + esc(th ? th.name : t) + '</span>';
    }).join("") + '</div>';
  }
  h += '<hr class="ashline">';

  if(e.sections && e.sections.length){
    e.sections.forEach(function(s, i){
      h += '<details class="panel sec"' + (i === 0 ? ' open' : '') + '><summary>' + esc(s.h) + '</summary><div class="pbody">' + paras(s.body) + '</div></details>';
    });
    h += panel("voices", "Further Voices", e.beneath);
    h += panel("ear", "The Roman Ear", e.beyond);
  } else {
    h += '<div class="note">' + linkify("Not yet written. This entry has its essence; the sections and depth panels arrive in the authoring batches. Every lens already points here.") + '</div>';
  }

  if(e.rels && e.rels.length){
    h += '<div class="rels"><div class="eyebrow cool">Connections</div>';
    e.rels.forEach(function(r){
      var o = BYID[r.id]; if(!o) return;
      h += '<a class="rel" href="#entity/' + r.id + '"><span class="rn">' + esc(o.name) + '</span> <span class="rl">\u2014 ' + esc(r.label) + '</span></a>';
    });
    h += '</div>';
  }
  return h;
}

/* ---------- render ---------- */
function render(restore){
  var hash = location.hash || "#home";
  var app = document.getElementById("app");
  var m = hash.match(/^#entity\/(.+)$/);
  var html, active = hash;
  if(m){ html = vEntity(m[1]); active = ""; }
  else if(hash === "#cost"){ html = vCost(); }
  else if(hash === "#books"){ html = vBooks(); }
  else if(hash === "#cast"){ html = vCast(); }
  else if(hash === "#index"){ html = vIndex(); }
  else { html = vHome(); active = "#home"; }
  app.innerHTML = html;
  tabs(active);
  document.getElementById("back").hidden = stack.length === 0;
  closePop();
  if(restore && scrollMem[hash] !== undefined) window.scrollTo(0, scrollMem[hash]);
  else window.scrollTo(0, 0);
  try { localStorage.setItem("aeneid.last", hash); } catch(err){}
}
window.addEventListener("hashchange", function(){ render(false); });
render(false);
</script>
</body>
</html>
